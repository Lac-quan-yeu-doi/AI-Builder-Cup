apiVersion: apps/v1
kind: Deployment
metadata:
  name: celesnity-web
  labels:
    app.kubernetes.io/name: celesnity-web
    app.kubernetes.io/component: frontend
spec:
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  progressDeadlineSeconds: 300
  selector:
    matchLabels:
      app.kubernetes.io/name: celesnity-web
      app.kubernetes.io/component: frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: celesnity-web
        app.kubernetes.io/component: frontend
    spec:
      serviceAccountName: celesnity-web
      automountServiceAccountToken: true
      terminationGracePeriodSeconds: 90
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: celesnity/web
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          env:
            - name: HOSTNAME
              value: '0.0.0.0'
            - name: PORT
              value: '3000'
          envFrom:
            - configMapRef:
                name: celesnity-web-config
          lifecycle:
            preStop:
              exec:
                # GCP's GCLB NEG controller deregisters a terminating pod's
                # endpoint asynchronously and can lag a few seconds behind the
                # pod actually receiving SIGTERM — without this delay the
                # container can stop accepting connections before the load
                # balancer stops routing to it, surfacing as a user-facing
                # 503/connection-refused during every scale-down. Well within
                # the 90s terminationGracePeriodSeconds below.
                command: ['/bin/sh', '-c', 'sleep 15']
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              memory: 384Mi
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 24
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ['ALL']
          volumeMounts:
            - name: next-cache
              mountPath: /app/.next/cache
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: next-cache
          emptyDir:
            sizeLimit: 256Mi
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
