apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: celesnity-web
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: celesnity-web
  minReplicas: 1
  maxReplicas: 2
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 75
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
    scaleUp:
      stabilizationWindowSeconds: 60
