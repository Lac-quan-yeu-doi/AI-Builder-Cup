apiVersion: networking.gke.io/v1
kind: GCPBackendPolicy
metadata:
  name: celesnity-web-message-block-stream
spec:
  default:
    securityPolicy: celesnity-gcp-dev-web
    timeoutSec: 300
    logging:
      enabled: true
      sampleRate: 1000000
      optionalMode: EXCLUDE_ALL_OPTIONAL
    connectionDraining:
      drainingTimeoutSec: 60
  targetRef:
    group: ''
    kind: Service
    name: celesnity-web-message-block-stream
