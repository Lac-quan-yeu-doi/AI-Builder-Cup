---
# Runtime configuration for celesnity-gcp-dev.
#
# Short, and it will stay short. The frontend's only real dependency is the core API
# URL, and that is compiled into the client bundle at build time rather than read
# here — see the --build-arg in cloudbuild.yaml. Anything the browser needs belongs
# to the build; anything the Node server needs belongs here.
#
# No Secret alongside this. The frontend holds no credentials: it calls the core API
# from the browser, so any token given to it would be readable by whoever opened the
# page.
apiVersion: v1
kind: ConfigMap
metadata:
  name: celesnity-web-config
data:
  NODE_ENV: 'production'
  CELESNITY_AUTH_MODE: 'identity-platform'
  NEXT_TELEMETRY_DISABLED: '1'
  CORE_API_URL: 'http://celesnity-core:3001/api/v1'
  AGENT_API_URL: 'http://minder-serve.minder.svc.cluster.local:8080/api/v2'
  WEB_ORIGIN: 'https://dev.celesnity.com'
  IDENTITY_PLATFORM_PROJECT_ID: 'cosmos3-mmad-research'
  IDENTITY_PLATFORM_API_KEY: 'identity-platform-browser-api-key-required'
  IDENTITY_PLATFORM_AUTH_DOMAIN: 'cosmos3-mmad-research.firebaseapp.com'
  NEXT_PUBLIC_AGENT_API_URL: '/api/agent'
  NEXT_PUBLIC_CHAT_AGENT_NAME: 'chat-assistant'
