apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: celesnity

resources:
  - ../common
  - config/web-config.yaml
  - routing/web-http-route.yaml
  - routing/web-backend-policy.yaml
  - routing/web-message-block-stream-backend-policy.yaml
  - routing/web-agent-stream-backend-policy.yaml
  - scaling/web-hpa.yaml
  - policy/web-pdb.yaml

images:
  - name: celesnity/web
    newName: asia-southeast1-docker.pkg.dev/cosmos3-mmad-research/celesnity-gcp-dev-apps/web
    newTag: development-latest
