apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: celesnity-prod

resources:
  - ../common
  - config/web-config.yaml
  - routing/web-http-route.yaml
  - routing/web-backend-policy.yaml
  - routing/web-message-block-stream-backend-policy.yaml
  - routing/web-agent-stream-backend-policy.yaml
  - scaling/web-hpa.yaml
  - policy/web-pdb.yaml

patches:
  - target:
      group: networking.k8s.io
      version: v1
      kind: NetworkPolicy
      name: celesnity-web-ingress
    patch: |-
      - op: replace
        path: /spec/egress/2/to/0/namespaceSelector/matchLabels/kubernetes.io~1metadata.name
        value: minder-prod

images:
  - name: celesnity/web
    newName: europe-west2-docker.pkg.dev/celesnity-minder-platform/celesnity-gcp-prod-apps/web
    newTag: production-release-required
