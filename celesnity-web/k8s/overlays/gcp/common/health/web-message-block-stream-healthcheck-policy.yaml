apiVersion: networking.gke.io/v1
kind: HealthCheckPolicy
metadata:
  name: celesnity-web-message-block-stream
spec:
  default:
    checkIntervalSec: 15
    timeoutSec: 5
    healthyThreshold: 1
    unhealthyThreshold: 3
    logConfig:
      enabled: false
    config:
      type: HTTP
      httpHealthCheck:
        port: 3000
        requestPath: /health
  targetRef:
    group: ''
    kind: Service
    name: celesnity-web-message-block-stream
