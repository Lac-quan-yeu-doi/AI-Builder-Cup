apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: celesnity-web-ingress
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: celesnity-web
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # The GKE Gateway and its health checks target the pod NEG directly. Only the
    # HTTP serving port is reachable; Cloud Armor controls client source ranges.
    - ports:
        - protocol: TCP
          port: 3000
  egress:
    # GKE Dataplane V2 evaluates kube-dns Service traffic in a way that does not
    # reliably match the kube-system pod selector. Restrict DNS by port instead;
    # the resolver address still comes from the pod's managed resolv.conf.
    - ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: celesnity-core
              app.kubernetes.io/component: api
      ports:
        - { protocol: TCP, port: 3001 }
    # Authenticated same-origin Agent gateway. The browser reaches /api/agent
    # on Web; only the Web pod can attach the verified caller identity and
    # reach minder-serve in its private namespace.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: minder
          podSelector:
            matchLabels:
              app.kubernetes.io/name: minder-serve
      ports:
        - { protocol: TCP, port: 8080 }
    - ports:
        - { protocol: TCP, port: 443 }
    - to:
        - ipBlock: { cidr: 169.254.169.254/32 }
      ports:
        - { protocol: TCP, port: 80 }
        - { protocol: TCP, port: 8080 }
