# Public entrypoint: load-balances celesnity-web replicas.
#
# The browser only ever talks to the web app, which proxies /api/core/* to
# celesnity-api and /api/agent/* to minder-runtime inside the compose network.
# Core, agent and infra stay unexposed (127.0.0.1 binds / no ports).

# Docker's embedded DNS. `resolve` below re-reads the replica IPs, so
# `docker compose up --scale celesnity-web=N` is picked up without a reload.
resolver 127.0.0.11 valid=10s ipv6=off;

upstream celesnity_web {
    zone celesnity_web 64k;
    # Long-lived SSE streams (rooms/runs) make round-robin uneven.
    least_conn;
    server celesnity-web:3000 resolve;
    keepalive 32;
}

# Shows which replica served each request (docker compose logs nginx).
log_format upstream '$remote_addr "$request" $status $body_bytes_sent '
                    'upstream=$upstream_addr rt=$request_time urt=$upstream_response_time';

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
}

server {
    listen 80 default_server;
    server_name _;
    # Server-level, so it replaces (not duplicates) the image's default log.
    access_log /var/log/nginx/access.log upstream;

    # Plant walkthrough / repair capture videos are capped at 2 GiB by the web
    # routes; stream them to Next instead of spooling to nginx's disk.
    client_max_body_size 2100m;
    proxy_request_buffering off;

    # Web routes allow up to maxDuration=300 (uploads, SSE streams).
    # SSE responses already send X-Accel-Buffering: no, so buffering stays on
    # for everything else.
    proxy_connect_timeout 10s;
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;

    location = /nginx-health {
        access_log off;
        return 200 "ok\n";
    }

    location / {
        proxy_pass http://celesnity_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}
