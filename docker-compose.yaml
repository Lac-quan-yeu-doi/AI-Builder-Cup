# Global development stack for the minder-sys workspace.
#
# Brings up all services in one command:
#   docker compose up -d --build --wait
#
# Services:
#   - Infrastructure: postgres, minio, redpanda, spark-master, trino-coordinator
#     (spark-worker / trino-worker default to 0 replicas, see Resources below)
#   - Mock source data: sample-postgres (Demo Data 1 + 2, see mock-data/README.md)
#   - Celesnity Core: api + worker (NestJS)
#   - Celesnity Web: Next.js frontend
#   - Minder Agent: runtime only (Rust minder-serve)
#   - nginx: public entrypoint, load-balances celesnity-web
#
# Prerequisites:
#   - Copy .env.example to .env and fill in required values
#   - Docker Desktop running
#
# Resources: sized for a 2 vCPU / 5 GB host serving one user. Memory limits
# sum to ~4.4 GiB (steady services); CPU limits are per-container ceilings so no
# single service can take both cores. JVMs (Trino, Spark) and Node heaps are
# capped explicitly to stay inside their container limit.
#
# Port map (only nginx is public; everything else binds 127.0.0.1):
#   80    nginx -> celesnity-web replicas (see nginx/default.conf)
#   5433  minder-agent postgres
#   7077  spark master
#   8080  trino coordinator
#   8081  spark master UI
#   8090  minder-agent runtime
#   9000  minio S3 API
#   9001  minio console
#   15432 celesnity postgres
#   15433 sample-postgres (mock source data)

name: minder-sys

# ============================================================================
# Shared config anchors
# ============================================================================

x-spark-image: &spark-image
  build:
    context: ./celesnity-infra/images/spark
    args:
      ICEBERG_VERSION: ${ICEBERG_VERSION:-1.11.0}
      POSTGRES_JDBC_VERSION: ${POSTGRES_JDBC_VERSION:-42.7.13}
  image: celesnity/spark:3.5.7-iceberg-1.11.0

x-spark-env: &spark-env
  AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-celesnity}
  AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-celesnity_minio_password}
  AWS_REGION: ${MINIO_REGION:-ap-southeast-1}
  AWS_ENDPOINT_URL: http://minio:9000
  POSTGRES_DB: ${POSTGRES_DB:-celesnity}
  POSTGRES_USER: ${POSTGRES_USER:-celesnity}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-celesnity_dev_password}
  POSTGRES_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-celesnity}
  WAREHOUSE_PATH: s3://${MINIO_BUCKET:-warehouse}
  CELESNITY_CATALOG_JDBC_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-celesnity}
  CELESNITY_CATALOG_JDBC_USER: ${POSTGRES_USER:-celesnity}
  CELESNITY_CATALOG_JDBC_PASSWORD: ${POSTGRES_PASSWORD:-celesnity_dev_password}
  SPARK_MASTER_HOST: spark-master
  SPARK_MASTER_INTERNAL_PORT: "7077"
  SPARK_DAEMON_MEMORY: 128m

x-trino-env: &trino-env
  POSTGRES_DB: ${POSTGRES_DB:-celesnity}
  POSTGRES_USER: ${POSTGRES_USER:-celesnity}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-celesnity_dev_password}
  MINIO_ROOT_USER: ${MINIO_ROOT_USER:-celesnity}
  MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-celesnity_minio_password}
  MINIO_BUCKET: ${MINIO_BUCKET:-warehouse}
  MINIO_REGION: ${MINIO_REGION:-ap-southeast-1}
  TRINO_QUERY_MAX_MEMORY: ${TRINO_QUERY_MAX_MEMORY:-256MB}
  TRINO_QUERY_MAX_MEMORY_PER_NODE: ${TRINO_QUERY_MAX_MEMORY_PER_NODE:-256MB}

x-core-env: &core-env
  NODE_ENV: development
  CELESNITY_AUTH_MODE: ${CELESNITY_AUTH_MODE:-local-development}
  LOCAL_DEV_AUTH_SIGNING_KEY: ${LOCAL_DEV_AUTH_SIGNING_KEY:-local-development-only-signing-key-do-not-use-in-prod}
  IDENTITY_PLATFORM_TENANT_ID: ${IDENTITY_PLATFORM_TENANT_ID:-local-dev-tenant}
  IDENTITY_BOOTSTRAP_ADMIN_SUBJECTS: ${IDENTITY_BOOTSTRAP_ADMIN_SUBJECTS:-},local-owner
  GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:-}
  GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET:-}
  # Chart share-link signing (ChartShareToken) — required, no default in
  # celesnity-core itself. Dev-only placeholder key; 7-day max TTL matches
  # .env.example.
  CHART_SHARE_SIGNING_KEY: ${CHART_SHARE_SIGNING_KEY:-local-development-only-chart-share-signing-key-not-for-prod}
  CHART_SHARE_TOKEN_MAX_TTL_MS: ${CHART_SHARE_TOKEN_MAX_TTL_MS:-604800000}
  # Agent write-throttling (RateLimitModule) and pending-action expiry
  # (ChartModule) — required, no default in celesnity-core itself.
  AGENT_WRITE_RATE_WINDOW_MS: ${AGENT_WRITE_RATE_WINDOW_MS:-60000}
  AGENT_WRITE_RATE_LIMIT: ${AGENT_WRITE_RATE_LIMIT:-120}
  PENDING_ACTION_TTL_MS: ${PENDING_ACTION_TTL_MS:-86400000}
  # Spark job size (local mode, one JVM in spark-master). Spark rejects driver
  # heaps under ~450m; a 5M-row groupBy peaked at ~500 MiB of the 768M limit.
  SPARK_DRIVER_MEMORY: 512m
  SPARK_EXECUTOR_MEMORY: 512m
  SPARK_EXECUTOR_CORES: "1"
  SPARK_MAX_CORES: "1"
  DATABASE_URL: postgresql://${POSTGRES_USER:-celesnity}:${POSTGRES_PASSWORD:-celesnity_dev_password}@postgres:5432/${POSTGRES_DB:-celesnity}?schema=celesnity_app
  MINIO_ENDPOINT: http://minio:9000
  MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-celesnity}
  MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-celesnity_minio_password}
  MINIO_WAREHOUSE_BUCKET: warehouse
  MINIO_ARTIFACTS_BUCKET: celesnity-artifacts
  TRINO_URL: http://trino-coordinator:8080
  CONNECTION_ALLOW_PRIVATE_DESTINATIONS: "true"
  CONNECTION_ALLOWED_HOSTS: postgres,sample-postgres,host.docker.internal
  # AgentWebhookClient (automation dispatch → minder-runtime) reads this
  # exact key — celesnity-core's own config schema never declares
  # MINDER_SERVE_URL (dead name, never read anywhere), so automations were
  # silently dispatching to MINDER_AGENT_URL's broken default
  # (http://minder-agent.internal, unresolvable in this network) instead.
  MINDER_AGENT_URL: http://minder-runtime:8080/api/v2
  MINDER_CHAT_AGENT_NAME: chat-assistant
  # Redpanda carries metadata-crawler runs, automation triggers and the MQTT
  # bronze stream; without it a crawler run is queued but never executed.
  INTEGRATION_EVENT_PUBLISHER_BACKEND: redpanda
  REDPANDA_BROKERS: redpanda:9092
  REDPANDA_USERNAME: ${REDPANDA_USERNAME:-celesnity-admin}
  REDPANDA_PASSWORD: ${REDPANDA_PASSWORD:-celesnity_redpanda_password}
  REDPANDA_TLS_ENABLED: "false"
  # MQTT control plane (EMQX runs with the `streaming` profile).
  EMQX_API_URL: http://emqx:18083/api/v5
  EMQX_API_KEY: celesnity-core
  EMQX_API_SECRET: ${EMQX_API_SECRET:-celesnity_emqx_api_secret}
  MQTT_PUBLIC_ENDPOINT: mqtt://localhost:${MQTT_PORT:-1883}

# ============================================================================
# Services
# ============================================================================

services:

  # --------------------------------------------------------------------------
  # Infrastructure: PostgreSQL (shared by celesnity-core)
  # --------------------------------------------------------------------------
  postgres:
    image: postgres:17.6-alpine
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 192M
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-celesnity}
      POSTGRES_USER: ${POSTGRES_USER:-celesnity}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-celesnity_dev_password}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-15432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./celesnity-infra/config/sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - infra

  # --------------------------------------------------------------------------
  # Mock source data: PostgreSQL standing in for two plants' MES/ERP systems
  #
  # Loads mock-data/init/*.sql.gz (schemas demo1_home_appliance and
  # demo2_coffee_capsules) the first time the volume is created. To reload
  # after rebuilding the dumps: docker compose down sample-postgres -v, then up.
  # Inside the compose network Core reaches it as sample-postgres:5432
  # (already in CONNECTION_ALLOWED_HOSTS).
  # --------------------------------------------------------------------------
  sample-postgres:
    image: postgres:17.6-alpine
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 96M
    environment:
      POSTGRES_DB: ${SAMPLE_POSTGRES_DB:-sample}
      POSTGRES_USER: ${SAMPLE_POSTGRES_USER:-sample}
      POSTGRES_PASSWORD: ${SAMPLE_POSTGRES_PASSWORD:-sample_dev_password}
    ports:
      - "127.0.0.1:${SAMPLE_POSTGRES_PORT:-15433}:5432"
    volumes:
      - sample_postgres_data:/var/lib/postgresql/data
      - ./mock-data/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    networks:
      - infra

  # --------------------------------------------------------------------------
  # Infrastructure: MinIO (S3-compatible object storage)
  # --------------------------------------------------------------------------
  minio:
    image: pgsty/silo:RELEASE.2026-09-16T00-00-00Z
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 320M
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-celesnity}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-celesnity_minio_password}
      GOMEMLIMIT: 256MiB
    ports:
      - "127.0.0.1:${MINIO_API_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - infra

  minio-init:
    image: pgsty/mc:RELEASE.2026-09-16T00-00-00Z
    restart: "no"
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 64M
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-celesnity}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-celesnity_minio_password}
      MINIO_BUCKET: ${MINIO_BUCKET:-warehouse}
      MINIO_ARTIFACTS_BUCKET: ${MINIO_ARTIFACTS_BUCKET:-celesnity-artifacts}
      MINIO_WORKSPACE_BUCKET: ${MINIO_WORKSPACE_BUCKET:-minder-workspace}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        /usr/bin/mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}"
        /usr/bin/mc mb --ignore-existing "local/$${MINIO_BUCKET}"
        /usr/bin/mc mb --ignore-existing "local/$${MINIO_ARTIFACTS_BUCKET}"
        /usr/bin/mc mb --ignore-existing "local/$${MINIO_WORKSPACE_BUCKET}"
        /usr/bin/mc version enable "local/$${MINIO_ARTIFACTS_BUCKET}"
        printf '' | /usr/bin/mc pipe "local/$${MINIO_ARTIFACTS_BUCKET}/scripts/.keep"
        printf '' | /usr/bin/mc pipe "local/$${MINIO_ARTIFACTS_BUCKET}/executions/.keep"
    networks:
      - infra

  # --------------------------------------------------------------------------
  # Messaging: Redpanda (Kafka API) + topic bootstrap
  # --------------------------------------------------------------------------
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v26.1.14
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
    command:
      - redpanda
      - start
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://redpanda:9092,external://localhost:${REDPANDA_PORT:-19092}
      - --schema-registry-addr=internal://0.0.0.0:8081,external://0.0.0.0:18081
      - --rpc-addr=redpanda:33145
      - --advertise-rpc-addr=redpanda:33145
      - --mode=dev-container
      - --smp=1
      - --memory=448M
      - --reserve-memory=0M
      - --default-log-level=warn
    environment:
      RP_BOOTSTRAP_USER: ${REDPANDA_USERNAME:-celesnity-admin}:${REDPANDA_PASSWORD:-celesnity_redpanda_password}
    ports:
      - "127.0.0.1:${REDPANDA_PORT:-19092}:19092"
    volumes:
      - redpanda_data:/var/lib/redpanda/data
      - ./celesnity-infra/config/redpanda/bootstrap.yaml:/etc/redpanda/.bootstrap.yaml:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "rpk cluster info -X brokers=127.0.0.1:9092 -X user=$${REDPANDA_USERNAME:-celesnity-admin} -X pass=$${REDPANDA_PASSWORD:-celesnity_redpanda_password} -X sasl.mechanism=SCRAM-SHA-256",
        ]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 10s
    networks:
      - infra

  redpanda-init:
    image: docker.redpanda.com/redpandadata/redpanda:v26.1.14
    restart: "no"
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M
    depends_on:
      redpanda:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-ceu"]
    command:
      - |
        RPK_ARGS=(-X brokers=redpanda:9092 -X user="$${REDPANDA_USERNAME}" -X pass="$${REDPANDA_PASSWORD}" -X sasl.mechanism=SCRAM-SHA-256)
        rpk topic create celesnity.streaming.control.v1 --partitions 1 --replicas 1 --topic-config cleanup.policy=compact "$${RPK_ARGS[@]}" || true
        rpk topic create celesnity.mqtt.raw.shared-0.v1 --partitions 12 --replicas 1 --topic-config retention.ms=604800000 "$${RPK_ARGS[@]}" || true
        rpk topic create celesnity.mqtt.dlq.v1 --partitions 3 --replicas 1 --topic-config retention.ms=604800000 "$${RPK_ARGS[@]}" || true
        rpk topic create celesnity.streaming.audit.v1 --partitions 3 --replicas 1 --topic-config retention.ms=2592000000 "$${RPK_ARGS[@]}" || true
        rpk topic create celesnity.data-workflow.cdc.v1 --partitions 6 --replicas 1 --topic-config retention.ms=604800000 "$${RPK_ARGS[@]}" || true
        rpk registry schema create celesnity.mqtt.raw.v1-value --schema /schemas/mqtt-bronze-envelope.schema.json --type json -X registry.hosts=redpanda:8081 -X user="$${REDPANDA_USERNAME}" -X pass="$${REDPANDA_PASSWORD}" || true
    environment:
      REDPANDA_USERNAME: ${REDPANDA_USERNAME:-celesnity-admin}
      REDPANDA_PASSWORD: ${REDPANDA_PASSWORD:-celesnity_redpanda_password}
    volumes:
      - ./celesnity-infra/config/redpanda:/schemas:ro
    networks:
      - infra

  # --------------------------------------------------------------------------
  # Streaming (profile `streaming`): MQTT broker → Redpanda → Iceberg bronze
  #
  #   SPARK_WORKER_REPLICAS=2 docker compose --profile streaming up -d
  #
  # The bronze stream holds one Spark worker permanently, so run two workers
  # with this profile or batch pipelines will queue behind it.
  # --------------------------------------------------------------------------
  emqx:
    profiles: [streaming]
    image: emqx/emqx:5.8.9
    restart: unless-stopped
    environment:
      EMQX_DASHBOARD__DEFAULT_PASSWORD: ${EMQX_DASHBOARD_PASSWORD:-celesnity_emqx_dashboard_password}
    ports:
      - "127.0.0.1:${MQTT_PORT:-1883}:1883"
      - "127.0.0.1:${EMQX_DASHBOARD_PORT:-18083}:18083"
    volumes:
      - ./celesnity-infra/config/emqx/base.hocon:/opt/emqx/etc/base.hocon:ro
      - ./celesnity-infra/config/emqx/default_api_key.conf:/opt/emqx/etc/default_api_key.conf:ro
      - ./celesnity-infra/config/emqx/auth-built-in-db-bootstrap.csv:/opt/emqx/etc/auth-built-in-db-bootstrap.csv:ro
      - ./celesnity-infra/config/emqx/acl.conf:/opt/emqx/etc/acl.conf:ro
      - emqx_data:/opt/emqx/data
    healthcheck:
      test: ["CMD", "/opt/emqx/bin/emqx_ctl", "status"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s
    networks:
      - infra

  redpanda-connect:
    profiles: [streaming]
    image: docker.redpanda.com/redpandadata/connect:4.104.0
    # The 4.104.0 arm64 binary segfaults on Apple Silicon before configuration
    # is loaded; the amd64 image runs under Docker Desktop's emulation.
    platform: ${REDPANDA_CONNECT_PLATFORM:-linux/amd64}
    restart: unless-stopped
    depends_on:
      emqx:
        condition: service_healthy
      redpanda-init:
        condition: service_completed_successfully
    command:
      [
        "streams",
        "--observability",
        "/etc/redpanda-connect/root.yaml",
        "/etc/redpanda-connect/streams/mqtt-to-redpanda.yaml",
      ]
    environment:
      MQTT_CONNECT_CLIENT_ID: ${MQTT_CONNECT_CLIENT_ID:-celesnity-redpanda-connect-shared-0}
      MQTT_CONNECT_USERNAME: ${MQTT_CONNECT_USERNAME:-celesnity-connect}
      MQTT_CONNECT_PASSWORD: ${MQTT_CONNECT_PASSWORD:-celesnity_connect_password}
      MQTT_BROKER_INTERNAL_URL: tcp://emqx:1883
      REDPANDA_BROKERS: redpanda:9092
      REDPANDA_USERNAME: ${REDPANDA_USERNAME:-celesnity-admin}
      REDPANDA_PASSWORD: ${REDPANDA_PASSWORD:-celesnity_redpanda_password}
    volumes:
      - ./celesnity-infra/config/redpanda-connect/root.yaml:/etc/redpanda-connect/root.yaml:ro
      - ./celesnity-infra/config/redpanda-connect/mqtt-to-redpanda.yaml:/etc/redpanda-connect/streams/mqtt-to-redpanda.yaml:ro
    networks:
      - infra

  mqtt-stream-init:
    profiles: [streaming]
    <<: *spark-image
    user: "0:0"
    restart: "no"
    command: ["/bin/bash", "-ceu", "mkdir -p /opt/spark/checkpoints/mqtt/shared-0 && chown -R 185:185 /opt/spark/checkpoints"]
    volumes:
      - mqtt_stream_checkpoints:/opt/spark/checkpoints
    networks:
      - infra

  # One always-running Structured Streaming driver consumes the raw Redpanda
  # topic. Registering adapters updates EMQX principals and ACLs; it does not
  # create another Spark application.
  mqtt-bronze-stream:
    profiles: [streaming]
    <<: *spark-image
    restart: unless-stopped
    command:
      - /opt/spark/bin/spark-submit
      - --master
      - spark://spark-master:7077
      - --deploy-mode
      - client
      - --driver-memory
      - 1g
      - --executor-memory
      - 1g
      - --executor-cores
      - "1"
      - --conf
      - spark.cores.max=1
      - /opt/celesnity/streaming/mqtt_bronze_stream.py
    environment:
      <<: *spark-env
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_SSLMODE: disable
      ARTIFACTS_BUCKET: ${MINIO_ARTIFACTS_BUCKET:-celesnity-artifacts}
      REDPANDA_BOOTSTRAP_SERVERS: redpanda:9092
      REDPANDA_USERNAME: ${REDPANDA_USERNAME:-celesnity-admin}
      REDPANDA_PASSWORD: ${REDPANDA_PASSWORD:-celesnity_redpanda_password}
      REDPANDA_SECURITY_PROTOCOL: SASL_PLAINTEXT
      REDPANDA_RAW_TOPIC: celesnity.mqtt.raw.shared-0.v1
      STREAMING_DEPLOYMENT_ID: shared-0
      STREAMING_TRIGGER_INTERVAL: 5 seconds
      STREAMING_CHECKPOINT_LOCATION: file:///opt/spark/checkpoints/mqtt/shared-0
      SPARK_DRIVER_HOST: mqtt-bronze-stream
    depends_on:
      spark-master:
        condition: service_healthy
      spark-worker:
        condition: service_healthy
      redpanda-init:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
      mqtt-stream-init:
        condition: service_completed_successfully
    volumes:
      - ./celesnity-infra/config/spark/mqtt_bronze_stream.py:/opt/celesnity/streaming/mqtt_bronze_stream.py:ro
      - mqtt_stream_checkpoints:/opt/spark/checkpoints
      - spark_ivy:/opt/spark/ivy
    networks:
      - infra

  # --------------------------------------------------------------------------
  # Infrastructure: Spark (master + worker)
  # --------------------------------------------------------------------------
  spark-master:
    <<: *spark-image
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 768M
    command: ["/bin/bash", "/opt/celesnity/start-master.sh"]
    environment: *spark-env
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${SPARK_MASTER_PORT:-7077}:7077"
      - "127.0.0.1:${SPARK_MASTER_UI_PORT:-8081}:8080"
    volumes:
      - ./celesnity-infra/images/spark/start-master.sh:/opt/celesnity/start-master.sh:ro
      - spark_ivy:/opt/spark/ivy
    healthcheck:
      test: ["CMD-SHELL", "bash -c ': >/dev/tcp/spark-master/7077' && bash -c ': >/dev/tcp/0.0.0.0/8080'"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s
    networks:
      - infra

  spark-worker:
    <<: *spark-image
    restart: unless-stopped
    deploy:
      replicas: ${SPARK_WORKER_REPLICAS:-0}
      resources:
        limits:
          cpus: "1.0"
          memory: 768M
    command: ["/bin/bash", "/opt/celesnity/start-worker.sh"]
    environment:
      <<: *spark-env
      SPARK_WORKER_CORES: ${SPARK_WORKER_CORES:-2}
      SPARK_WORKER_MEMORY: ${SPARK_WORKER_MEMORY:-1g}
    depends_on:
      spark-master:
        condition: service_healthy
    volumes:
      - ./celesnity-infra/images/spark/start-worker.sh:/opt/celesnity/start-worker.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "bash -c ': >/dev/tcp/localhost/8081'"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s
    networks:
      - infra

  # --------------------------------------------------------------------------
  # Infrastructure: Trino (coordinator + worker)
  # --------------------------------------------------------------------------
  trino-coordinator:
    image: trinodb/trino:483
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: ${TRINO_COORDINATOR_MEMORY:-896M}
    environment: *trino-env
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${TRINO_PORT:-8080}:8080"
    volumes:
      - ./celesnity-infra/config/trino/coordinator.properties:/etc/trino/config.properties:ro
      # Heap = 65% of the container limit (image default 80% leaves too little
      # non-heap room under a small limit and gets OOM-killed).
      - ./trino/jvm.config:/etc/trino/jvm.config:ro
      - ./celesnity-infra/config/trino/node.properties:/etc/trino/node.properties:ro
      - ./celesnity-infra/config/trino/access-control.properties:/etc/trino/access-control.properties:ro
      - ./celesnity-infra/config/trino/access-control-rules.json:/etc/trino/access-control-rules.json:ro
      - ./celesnity-infra/local/catalog:/etc/trino/catalog:ro
      - trino_data:/data/trino
    healthcheck:
      test: ["CMD", "/usr/lib/trino/bin/health-check"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks:
      - infra

  trino-worker:
    image: trinodb/trino:483
    restart: unless-stopped
    deploy:
      replicas: ${TRINO_WORKER_REPLICAS:-0}
      resources:
        limits:
          cpus: "1.0"
          memory: ${TRINO_WORKER_MEMORY:-896M}
    environment: *trino-env
    depends_on:
      trino-coordinator:
        condition: service_started
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    volumes:
      - ./celesnity-infra/config/trino/worker.properties:/etc/trino/config.properties:ro
      - ./trino/jvm.config:/etc/trino/jvm.config:ro
      - ./celesnity-infra/config/trino/node.properties:/etc/trino/node.properties:ro
      - ./celesnity-infra/local/catalog:/etc/trino/catalog:ro
    healthcheck:
      test: ["CMD", "/usr/lib/trino/bin/health-check"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks:
      - infra

  # --------------------------------------------------------------------------
  # Trino: demo warehouse seed (one-shot)
  #
  # Loads the committed iceberg.demo fixture (customers + orders) into the
  # managed Iceberg catalog so the platform's shared read-only demo namespace
  # (iceberg.demo bypass in AdministrationUseCases.authorizeCatalog) has data
  # to browse and query out of the box. Runs the trino CLI bundled in the
  # trino image as the write-capable 'celesnity' identity (the only principal
  # the file access-control policy lets create/populate iceberg schemas).
  # Idempotent: the fixture DROPs then CREATEs its tables before INSERT, so
  # re-running on every `up` converges to the same 300 customers / 2000 orders.
  # --------------------------------------------------------------------------
  trino-seed:
    image: trinodb/trino:483
    restart: "no"
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
    depends_on:
      trino-coordinator:
        condition: service_healthy
    volumes:
      - ./trino/seed/demo-tabular.sql:/seed/demo-tabular.sql:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        /usr/bin/trino --server http://trino-coordinator:8080 \
          --catalog iceberg --user celesnity -f /seed/demo-tabular.sql
    networks:
      - infra

  # --------------------------------------------------------------------------
  # Celesnity Core: DB migrations (one-shot)
  #
  # Uses the Dockerfile `migrator` target, which bundles the Prisma CLI and
  # migration files. Local-development identity data is persisted in the
  # Postgres volume.
  # --------------------------------------------------------------------------
  celesnity-migrate:
    build:
      context: ./celesnity-core
      target: migrator
    image: celesnity/core-migrate:dev
    restart: "no"
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 320M
    environment:
      <<: *core-env
      NODE_ENV: development
      # Migrate, then the local-development org + login personas, then Core's
      # organization bootstrap (verifies them, adds service identities). Tenant 'local' is fixed by
      # the local-development token verifier.
      BOOTSTRAP_ORGANIZATION_ID: 00000000-0000-4000-8000-000000000002
      BOOTSTRAP_ORGANIZATION_SLUG: local-development
      BOOTSTRAP_ORGANIZATION_NAME: Local Development
      BOOTSTRAP_HOME_REGION: local
      BOOTSTRAP_IDENTITY_TENANT_ID: local
    command:
      - /bin/sh
      - -ec
      - |
        /app/node_modules/.bin/prisma migrate deploy
        /app/node_modules/.bin/prisma db execute --file /seed/core-local-personas.sql
        node dist/bootstrap/organization-bootstrap-main.js
    volumes:
      - ./seed/core-local-personas.sql:/seed/core-local-personas.sql:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - infra

  # --------------------------------------------------------------------------
  # Celesnity Core: API server
  # --------------------------------------------------------------------------
  celesnity-api:
    build:
      context: ./celesnity-core
    image: celesnity/core:dev
    restart: unless-stopped
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: "1.0"
          memory: 352M
    command: ["node", "dist/bootstrap/api-main.js"]
    environment:
      <<: *core-env
      PORT: "3001"
      API_BIND_ADDRESS: 0.0.0.0
      API_AUTH_ENABLED: "false"
      NODE_OPTIONS: --max-old-space-size=224
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost}
      SPARK_MASTER_URL: spark://spark-master:7077
    depends_on:
      postgres:
        condition: service_healthy
      celesnity-migrate:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
      redpanda-init:
        condition: service_completed_successfully
      trino-coordinator:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3001/api/v1/health/live').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - infra

  # --------------------------------------------------------------------------
  # Celesnity Core: Execution worker
  # --------------------------------------------------------------------------
  celesnity-worker:
    build:
      context: ./celesnity-core
    image: celesnity/core:dev
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 352M
    command: ["node", "dist/bootstrap/worker-main.js"]
    environment:
      <<: *core-env
      SPARK_EXECUTION_BACKEND: docker
      # Local mode: driver + executor in one JVM inside spark-master, so no
      # spark-worker is needed (Core skips the standalone capacity probe).
      SPARK_SUBMIT_MASTER_URL: local[1]
      NODE_OPTIONS: --max-old-space-size=224
      SPARK_CONTAINER: ${COMPOSE_PROJECT_NAME:-minder-sys}-spark-master-1
      # Pin the Iceberg catalog Spark writes to. A pipeline execution injects its
      # *source* connection as POSTGRES_URL/USER/PASSWORD, and without these the
      # generated job registers its output tables in the source database, where
      # Trino never sees them (the run still reports SUCCEEDED).
      CELESNITY_CATALOG_JDBC_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-celesnity}
      CELESNITY_CATALOG_JDBC_USER: ${POSTGRES_USER:-celesnity}
      CELESNITY_CATALOG_JDBC_PASSWORD: ${POSTGRES_PASSWORD:-celesnity_dev_password}
    depends_on:
      redpanda-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      celesnity-migrate:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
      spark-master:
        condition: service_healthy
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - infra

  # --------------------------------------------------------------------------
  # Celesnity Web: Next.js frontend
  # --------------------------------------------------------------------------
  celesnity-web:
    build:
      context: ./celesnity-web
      args:
        NEXT_PUBLIC_CORE_API_URL: http://localhost:3001/api/v1
        NEXT_PUBLIC_AGENT_API_URL: /api/agent
        NEXT_PUBLIC_CHAT_AGENT_NAME: chat-assistant
        NEXT_PUBLIC_SKILL_CHAT_AGENT_NAME: skill-creator
        NEXT_PUBLIC_AUTOMATION_WORKFLOW_CHAT_AGENT_NAME: automation-workflow-editor
        NEXT_PUBLIC_PLANT_MODEL_CHAT_AGENT_NAME: plant-model-assistant
    image: celesnity/web:dev
    restart: unless-stopped
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: "1.0"
          memory: 224M
    environment:
      NODE_ENV: development
      NODE_OPTIONS: --max-old-space-size=144
      NEXT_PUBLIC_CORE_API_URL: http://localhost:3001/api/v1
      NEXT_PUBLIC_AGENT_API_URL: /api/agent
      NEXT_PUBLIC_CHAT_AGENT_NAME: chat-assistant
      NEXT_PUBLIC_SKILL_CHAT_AGENT_NAME: skill-creator
      NEXT_PUBLIC_AUTOMATION_WORKFLOW_CHAT_AGENT_NAME: automation-workflow-editor
      NEXT_PUBLIC_PLANT_MODEL_CHAT_AGENT_NAME: plant-model-assistant
      CELESNITY_AUTH_MODE: ${CELESNITY_AUTH_MODE:-local-development}
      LOCAL_DEV_AUTH_SIGNING_KEY: ${LOCAL_DEV_AUTH_SIGNING_KEY:-local-development-only-signing-key-do-not-use-in-prod}
      IDENTITY_PLATFORM_PROJECT_ID: ${IDENTITY_PLATFORM_PROJECT_ID:-}
      IDENTITY_PLATFORM_TENANT_ID: ${IDENTITY_PLATFORM_TENANT_ID:-local-dev-tenant}
      IDENTITY_PLATFORM_API_KEY: ${IDENTITY_PLATFORM_API_KEY:-}
      IDENTITY_PLATFORM_AUTH_DOMAIN: ${IDENTITY_PLATFORM_AUTH_DOMAIN:-}
      IDENTITY_BOOTSTRAP_ADMIN_SUBJECTS: ${IDENTITY_BOOTSTRAP_ADMIN_SUBJECTS:-}
      GOOGLE_APPLICATION_CREDENTIALS: /gcloud/application_default_credentials.json
      WEB_ORIGIN: http://localhost:3000
      CORE_API_URL: http://celesnity-api:3001/api/v1
      AGENT_API_URL: http://minder-runtime:8080/api/v2
      AGENT_AUTH_MODE: core-assertion
      # Plant walkthroughs: Gemini maps a floor video to a plant model.
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_WALKTHROUGH_MODEL: ${GEMINI_WALKTHROUGH_MODEL:-gemini-flash-latest}
    volumes:
      - ${HOME}/.config/gcloud:/gcloud:ro
    tmpfs:
      - /app/.next/cache:mode=1777
    depends_on:
      celesnity-api:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - infra

  # --------------------------------------------------------------------------
  # nginx: public entrypoint
  # --------------------------------------------------------------------------
  nginx:
    image: nginx:1.29-alpine
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 32M
    ports:
      # Host port; behind a reverse proxy (e.g. Dokploy/Traefik owns :80) set
      # NGINX_PORT=127.0.0.1:18088 and route the domain to nginx:80 instead.
      - "${NGINX_PORT:-80}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      celesnity-web:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/nginx-health"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - infra

  # --------------------------------------------------------------------------
  # Minder Agent: PostgreSQL (agent's own database)
  # --------------------------------------------------------------------------
  minder-db:
    image: postgres:16-alpine
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 96M
    environment:
      POSTGRES_USER: minder
      POSTGRES_PASSWORD: minder
      POSTGRES_DB: minder_platform
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - minder_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U minder -d minder_platform"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - infra

  minder-migrate:
    image: minder/runtime:dev
    restart: "no"
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
    environment:
      DATABASE_URL: postgres://minder:minder@minder-db:5432/minder_platform?schema=minder_agent
      MINDER_DATABASE_SCHEMA: minder_agent
    command:
      - node_modules/prisma/build/index.js
      - migrate
      - deploy
      - --schema
      - src/infrastructure/prisma/schema.prisma
    depends_on:
      minder-db:
        condition: service_healthy
    networks:
      - infra

  # --------------------------------------------------------------------------
   # Minder Agent: Runtime (native TypeScript minder-serve)
  # --------------------------------------------------------------------------
  minder-runtime:
    build:
      context: ./minder-agent
      args:
        AGENT_BASE_IMAGE: minder/runtime-base:dev
    image: minder/runtime:dev
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 320M
    environment: &minder-runtime-env
      NODE_ENV: development
      NODE_OPTIONS: --max-old-space-size=192
      LLM_BASE_URL: ${LLM_BASE_URL:?set LLM_BASE_URL in .env}
      LLM_API_KEY: ${LLM_API_KEY:?set LLM_API_KEY in .env}
      LLM_MODEL: ${LLM_MODEL:-gpt-5-mini}
      LLM_TEMPERATURE: "${LLM_TEMPERATURE:-}"
      DATABASE_URL: postgres://minder:minder@minder-db:5432/minder_platform?schema=minder_agent
      MINDER_DATABASE_SCHEMA: minder_agent
      MINDER_SERVE_ADDR: 0.0.0.0:8080
      MINDER_WORKSPACE_DIR: /tmp/minder-workspaces
      MINDER_SANDBOX_SOCKET: /run/minder-sandbox/runner.sock
      MINDER_AUTH_MODE: core-assertion
      MINDER_ASSERTION_ISSUER: celesnity-core
      MINDER_ASSERTION_AUDIENCE: minder-agent
      MINDER_ASSERTION_PUBLIC_KEYS_JSON: >-
        {"local-development-2026":"-----BEGIN PUBLIC KEY-----\nMCowBQYDK2VwAyEAl1Av5WiH2hZW9SMhYdkzCLnjjIcnWbiukpuSdUa/iwU=\n-----END PUBLIC KEY-----\n"}
      MINDER_ASSERTION_REPLAY_CACHE_CAPACITY: "1024"

      TRINO_MCP_URL: http://celesnity-api:3001/api/v1/trino-mcp
      CHART_MCP_URL: http://celesnity-api:3001/api/v1/chart-mcp
      DOCUMENT_MCP_URL: http://celesnity-api:3001/api/v1/document-mcp
      PLANT_MODEL_MCP_URL: http://celesnity-api:3001/api/v1/plant-model-mcp
      AUTOMATION_WORKFLOW_MCP_URL: http://celesnity-api:3001/api/v1/automation-workflow-mcp
      SKILL_MCP_URL: http://celesnity-api:3001/api/v1/skill-mcp
      CLOUD_FILE_MCP_URL: http://celesnity-api:3001/api/v1/cloud-file-mcp
      MCP_SHARED_SECRET: ${MCP_SHARED_SECRET:-local-development-mcp-shared-secret}
      CELESNITY_CORE_AUDIENCE: http://celesnity-api:3001
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-celesnity}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-celesnity_minio_password}
      MINIO_WORKSPACE_BUCKET: ${MINIO_WORKSPACE_BUCKET:-minder-workspace}
      MINIO_SECURE: "false"
      CELESNITY_CORE_URL: http://celesnity-api:3001
    ports:
      - "127.0.0.1:8090:8080"
    volumes:
      - ./minder-agent/.minder/skills:/app/.minder/skills
      - minder_workspace_cache:/tmp/minder-workspaces
      - minder_sandbox_socket:/run/minder-sandbox
    depends_on:
      minder-db:
        condition: service_healthy
      minder-migrate:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
      celesnity-api:
        condition: service_healthy
      minder-sandbox-runner:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - /nodejs/bin/node
        - -e
        - >-
          fetch('http://127.0.0.1:8080/api/v2/healthz').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))
      interval: 10s
      timeout: 3s
      start_period: 15s
      retries: 5
    networks:
      - infra

  # --------------------------------------------------------------------------
  # Minder Agent: built-in agent manifests per Core organization (one-shot)
  # Runs minder-agent's manifest-workspace-migrations entrypoint; the
  # seed script swaps GCP workload identity for the MCP shared secret.
  # --------------------------------------------------------------------------
  minder-manifest-migrate:
    image: minder/runtime:dev
    restart: "no"
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
    environment: *minder-runtime-env
    command: ["/seed/agent-manifest-migrations.mjs"]
    volumes:
      - ./seed/agent-manifest-migrations.mjs:/seed/agent-manifest-migrations.mjs:ro
      # Runtime trusts its (persistent) local workspace cache once marked ready;
      # write through it so a rerun is visible without wiping the volume.
      - minder_workspace_cache:/tmp/minder-workspaces
    depends_on:
      minder-migrate:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
      celesnity-api:
        condition: service_healthy
    networks:
      - infra

  minder-sandbox-runner:
    build:
      context: ./minder-agent
      # This snapshot of minder-agent ships a self-contained sandbox Dockerfile
      # (no docker/*-base.Dockerfile), so no base image has to be built first.
      dockerfile: sandbox-runner/Dockerfile
    image: minder/sandbox-runner:dev
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 384M
    environment:
      MINDER_SANDBOX_SOCKET: /run/minder-sandbox/runner.sock
      MINDER_WORKSPACE_CACHE: /tmp/minder-workspaces
      MINDER_SANDBOX_SCRATCH: /sandbox-scratch
    volumes:
      - minder_workspace_cache:/tmp/minder-workspaces
      - minder_sandbox_socket:/run/minder-sandbox
    tmpfs:
      - /sandbox-scratch:uid=65532,gid=65532,mode=0700
    network_mode: none
    # Keep Docker's default syscall policy, with the namespace/mount calls
    # Bubblewrap needs enabled only for this isolated runner.
    security_opt:
      - seccomp:./minder-agent/sandbox-runner/seccomp.json
      # Docker's default AppArmor profile (Ubuntu/Debian hosts) denies the
      # mount calls Bubblewrap makes ("bwrap: Failed to make / slave"). The
      # runner stays isolated by network_mode none, the seccomp profile above
      # and its non-root user. No-op on hosts without AppArmor (Docker Desktop).
      - apparmor:unconfined
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          require('node:fs').accessSync(process.env.MINDER_SANDBOX_SOCKET)
      interval: 3s
      timeout: 2s
      start_period: 60s
      retries: 10

  # --------------------------------------------------------------------------
  # Dev base images (build-only, `base` profile)
  #
  # Pre-built dependency layers for the minder-runtime and minder-sandbox-runner
  # builds above, from minder-agent/docker/*-base.Dockerfile. Build
  # them once before the first `docker compose build`, and again after changing:
  #   - minder-agent package.json / package-lock.json (runtime base; the runtime
  #     build falls back to `npm ci` if they differ, so a stale base is only slow)
  #   - sandbox-runner package.json / package-lock.json, sandbox-requirements.*.lock,
  #     XlsWorkbookTool.java, or either docker/*-base.Dockerfile (apt packages,
  #     Typst/Pandoc versions)
  #
  #   docker compose build minder-runtime-base minder-sandbox-runner-base
  # --------------------------------------------------------------------------
  minder-runtime-base:
    build:
      context: ./minder-agent
      dockerfile: docker/agent-base.Dockerfile
    image: minder/runtime-base:dev
    profiles: ["base"]

  minder-sandbox-runner-base:
    build:
      context: ./minder-agent
      dockerfile: docker/sandbox-base.Dockerfile
    image: minder/sandbox-runner-base:dev
    profiles: ["base"]

# ============================================================================
# Networks
# ============================================================================
networks:
  infra:

# ============================================================================
# Volumes
# ============================================================================
volumes:
  postgres_data:
  sample_postgres_data:
  minio_data:
  spark_ivy:
  redpanda_data:
  emqx_data:
  mqtt_stream_checkpoints:
  trino_data:
  minder_pgdata:
  minder_workspace_cache:
  minder_sandbox_socket:
