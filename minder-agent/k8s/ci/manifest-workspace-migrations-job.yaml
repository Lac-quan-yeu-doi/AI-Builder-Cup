apiVersion: batch/v1
kind: Job
metadata:
  name: __JOB_NAME__
  namespace: __NAMESPACE__
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: minder-manifest-migrate
        celesnity.io/core-client: "true"
    spec:
      serviceAccountName: celesnity-agent
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: __AGENT_IMAGE__
          args: ["dist/bootstrap/manifest-workspace-migrations-main.js"]
          envFrom:
            - configMapRef:
                name: minder-serve-config
            - secretRef:
                name: minder-serve-secrets
            - secretRef:
                name: minder-serve-storage
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: home
              mountPath: /home/nonroot
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 128Mi
        - name: home
          emptyDir:
            sizeLimit: 64Mi
