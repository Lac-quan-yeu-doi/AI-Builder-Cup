apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: minder-prod

resources:
  - ../../base
  - configmap.yaml
  - secret.yaml
  - hpa.yaml
  - networkpolicy.yaml

images:
  - name: minder/minder-serve
    newName: europe-west2-docker.pkg.dev/celesnity-minder-platform/celesnity-gcp-prod-apps/minder-serve
    newTag: production-release-required
  - name: minder/minder-sandbox-runner
    newName: europe-west2-docker.pkg.dev/celesnity-minder-platform/celesnity-gcp-prod-apps/minder-sandbox-runner
    newTag: production-release-required
