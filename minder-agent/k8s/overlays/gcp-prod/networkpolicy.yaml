apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: minder-default-deny-ingress
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: minder-serve-from-web-only
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: minder-serve
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: celesnity-prod
          podSelector:
            matchLabels:
              app.kubernetes.io/name: celesnity-web
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: celesnity-prod
          podSelector:
            matchLabels:
              app.kubernetes.io/name: celesnity-core
      ports:
        - protocol: TCP
          port: 8080
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: gmp-system
      ports:
        - protocol: TCP
          port: 8080
