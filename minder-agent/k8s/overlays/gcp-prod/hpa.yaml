apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: minder-serve
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: minder-serve
  minReplicas: 1
  maxReplicas: 3
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 75
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
    scaleUp:
      stabilizationWindowSeconds: 60
