---
# Phase 0 contains only the operational compatibility host.
apiVersion: v1
kind: ConfigMap
metadata:
  name: minder-serve-config
data:
  NODE_ENV: "production"
  MINDER_WORKSPACE_DIR: "/tmp/minder-workspaces"
  MINDER_SANDBOX_SOCKET: "/run/minder-sandbox/runner.sock"
  RUST_LOG: "minder_serve=info,minder_agent=info,minder_app=info,minder_mcp=info"
  MINDER_AUTH_MODE: "core-assertion"
  MINDER_ASSERTION_ISSUER: "celesnity-core"
  MINDER_ASSERTION_AUDIENCE: "minder-agent"
  MINDER_ASSERTION_REPLAY_CACHE_CAPACITY: "10000"

  # Comma-separated. Empty means no browser is allowed to call this service
  # directly — correct for an internal-only Service; set it only if a browser
  # (rather than a trusted backend) ever calls minder-serve directly.
  # Browser traffic terminates at Web's authenticated same-origin /api/agent
  # gateway. minder-serve is private and therefore needs no CORS allowance.
  MINDER_SERVE_CORS_ORIGINS: ""

  # Requires Gemini's OpenAI-compatible endpoint and API key in minder-serve-secrets.
  LLM_MODEL: "gemini-3.8-flash"
  # Left unset by default: reasoning models reject any temperature but their
  # own, and gpt-5 through LiteLLM hard-errors on an explicit 0.7. Uncomment
  # only for a model known to accept it.
  # LLM_TEMPERATURE: "0.7"

  # trino/chart/document are Remote MCP servers (celesnity-core's own
  # MCP-over-HTTP endpoints), resolved at manifest-load time — unset, the
  # agent silently ends up with zero tools for that server for the
  # process's lifetime. MCP_SHARED_SECRET is deliberately absent here: it's
  # a credential and belongs in a k8s Secret, not this ConfigMap.
  TRINO_MCP_URL: "http://celesnity-core.celesnity.svc.cluster.local:3001/api/v1/trino-mcp"
  CHART_MCP_URL: "http://celesnity-core.celesnity.svc.cluster.local:3001/api/v1/chart-mcp"
  DOCUMENT_MCP_URL: "http://celesnity-core.celesnity.svc.cluster.local:3001/api/v1/document-mcp"
  PLANT_MODEL_MCP_URL: "http://celesnity-core.celesnity.svc.cluster.local:3001/api/v1/plant-model-mcp"
  # Required by the automation-workflow-editor agent manifest. Missing this
  # var fails AgentManifest::validate() for that manifest, which — because
  # load_agents() fails fast on the first validation error — drops EVERY
  # manifest and leaves the process with zero MCP tools for all agents.
  AUTOMATION_WORKFLOW_MCP_URL: "http://celesnity-core.celesnity.svc.cluster.local:3001/api/v1/automation-workflow-mcp"
  # Required by the skill-creator agent manifest — same fail-fast rule as
  # AUTOMATION_WORKFLOW_MCP_URL above: a missing var drops every manifest.
  SKILL_MCP_URL: "http://celesnity-core.celesnity.svc.cluster.local:3001/api/v1/skill-mcp"
  # Required by chat-assistant (Google Drive / cloud file tools) — same fail-fast rule.
  CLOUD_FILE_MCP_URL: "http://celesnity-core.celesnity.svc.cluster.local:3001/api/v1/cloud-file-mcp"

  SQL_QUERY_TIMEOUT_MS: "60000"
  SQL_MAX_RESULT_ROWS: "1000"
  # Keep Minder's runtime tables isolated from celesnity-core's public schema.
  MINDER_DATABASE_SCHEMA: "minder_agent"

  # Core is cluster-private. The same URL is used as the Google ID-token
  # audience, binding each short-lived token to this service.
  CELESNITY_CORE_URL: "http://celesnity-core.celesnity.svc.cluster.local:3001"
  CELESNITY_CORE_AUDIENCE: "http://celesnity-core.celesnity.svc.cluster.local:3001"
  CHART_API_URL: "http://celesnity-core.celesnity.svc.cluster.local:3001/api/v1"

  # Use the existing dev artifacts bucket as the single durable S3-compatible
  # workspace. The provider scopes every room and manifest path beneath an
  # owner-specific prefix, so the bucket can safely be shared by tenants.
  # Credentials are injected into minder-serve-storage by Cloud Build.
  MINIO_ENDPOINT: "https://storage.googleapis.com"
  MINIO_WORKSPACE_BUCKET: "celesnity-gcp-dev-artifacts-cosmos3-mmad-research"
  MINIO_SECURE: "true"
