apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: minder-default-deny-ingress
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: minder-serve-from-web-only
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: minder-serve
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: celesnity
          podSelector:
            matchLabels:
              app.kubernetes.io/name: celesnity-web
      ports:
        - protocol: TCP
          port: 8080
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: gmp-system
      ports:
        - protocol: TCP
          port: 8080
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  # AgentWebhookClient (celesnity-core's automation dispatcher) calls
  # POST /webhooks/{source} to fire agent automations. Covers both the api
  # component (test-fire, synchronous) and the worker component (scheduled
  # dispatch), which share app.kubernetes.io/name: celesnity-core.
  name: minder-serve-from-celesnity-core
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: minder-serve
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: celesnity
          podSelector:
            matchLabels:
              app.kubernetes.io/name: celesnity-core
      ports:
        - protocol: TCP
          port: 8080
