---
# Runtime secrets, filled in by CI from Secret Manager before apply.
#
# Each value below is a marker wrapped in double underscores, meant to be
# replaced with a base64-encoded secret by an "inject-secrets" build step, the
# same convention celesnity-core's k8s/overlays/gcp-dev/secret.yaml uses.
# Nothing sensitive is committed here.
apiVersion: v1
kind: Secret
metadata:
  name: minder-serve-secrets
type: Opaque
data:
  LLM_BASE_URL: "__LLM_BASE_URL__"
  LLM_API_KEY: "__LLM_API_KEY__"
  MINDER_ASSERTION_PUBLIC_KEYS_JSON: "__MINDER_ASSERTION_PUBLIC_KEYS_JSON__"

  # Cloud SQL, private-IP-only. Point this at whatever Postgres instance this
  # environment uses — sslmode is part of the URL itself since minder-store-pg
  # takes one connection string rather than the five split POSTGRES_* keys
  # celesnity-core's Secret uses.
  DATABASE_URL: "__DATABASE_URL__"

  # Static bearer for celesnity-core's chart/document MCP-over-HTTP
  # endpoints (see MCP_SHARED_SECRET in celesnity-core's environment.ts) —
  # must match the value configured there exactly. Long-lived by design: the
  # Remote MCP transport resolves headers once at manifest load and never
  # refreshes them, so rotate this by redeploying both services, not on a
  # schedule tied to a token's own expiry.
  MCP_SHARED_SECRET: "__MCP_SHARED_SECRET__"

---
# Optional (the Deployment references this Secret with optional: true):
# only needed once MINIO_ENDPOINT (in the ConfigMap) is set, which switches
# provider_from_env() from a local-disk workspace to GCS through the
# S3-compatible XML API — same MinIO-client approach celesnity-core uses
# against storage.googleapis.com. MINIO_ENDPOINT/WORKSPACE_BUCKET themselves
# are not secret and live in configmap.yaml instead.
apiVersion: v1
kind: Secret
metadata:
  name: minder-serve-storage
type: Opaque
data:
  MINIO_ACCESS_KEY: "__GCS_HMAC_ACCESS_KEY__"
  MINIO_SECRET_KEY: "__GCS_HMAC_SECRET_KEY__"
