apiVersion: apps/v1
kind: Deployment
metadata:
  name: minder-serve
spec:
  template:
    spec:
      containers:
        - name: sandbox-runner
          securityContext:
            # containerd's default AppArmor profile denies Bubblewrap's mounts.
            # This exception is limited to the dev runner; the isolation smoke
            # Job must pass before the Agent Deployment is changed.
            appArmorProfile:
              type: Unconfined
