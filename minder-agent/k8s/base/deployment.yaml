---
# ClusterIP only. minder-serve verifies short-lived Core assertions and has no
# public edge authentication of its own, so it remains reachable only from
# trusted callers and the managed Prometheus scraper. No HTTPRoute/BackendPolicy
# exists here; add one with the gateway.
apiVersion: v1
kind: Service
metadata:
  name: minder-serve
  labels:
    app.kubernetes.io/name: minder-serve
    app.kubernetes.io/component: runtime
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: minder-serve
    app.kubernetes.io/component: runtime
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: minder-serve
  labels:
    app.kubernetes.io/name: minder-serve
    app.kubernetes.io/component: runtime
spec:
  # No spec.replicas: the overlay attaches an HPA, and a Deployment that
  # declares its own count fights it on every apply. Defaults to 1 on create.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  # Matches the deployment pipeline's rollout timeout.
  progressDeadlineSeconds: 600
  selector:
    matchLabels:
      app.kubernetes.io/name: minder-serve
      app.kubernetes.io/component: runtime
  template:
    metadata:
      labels:
        app.kubernetes.io/name: minder-serve
        app.kubernetes.io/component: runtime
        celesnity.io/core-client: "true"
    spec:
      serviceAccountName: celesnity-agent
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        # Matches the distroless nonroot image's built-in user
        # (gcr.io/distroless/nodejs22-debian12:nonroot).
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: minder-serve
          image: minder/minder-serve
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP

          env:
            - name: MINDER_SERVE_ADDR
              value: "0.0.0.0:8080"
          envFrom:
            - configMapRef:
                name: minder-serve-config
            - secretRef:
                name: minder-serve-secrets
            - secretRef:
                name: minder-serve-storage
                optional: true

          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              # No CPU limit: this is a single-threaded-feeling async runtime
              # under load from LLM calls, and throttling it shows up as
              # request latency rather than as a visible resource signal.
              memory: 512Mi

          # Readiness requires the authenticated runtime composition. Liveness
          # only reports whether the HTTP process is responding.
          startupProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 40
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /livez
              port: http
            periodSeconds: 30
            timeoutSeconds: 3
            failureThreshold: 3

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: workspace-cache
              mountPath: /tmp/minder-workspaces
            - name: sandbox-socket
              mountPath: /run/minder-sandbox
            - name: home
              mountPath: /home/nonroot

        - name: sandbox-runner
          image: minder/minder-sandbox-runner
          imagePullPolicy: IfNotPresent
          env:
            - name: MINDER_SANDBOX_SOCKET
              value: /run/minder-sandbox/runner.sock
            - name: MINDER_WORKSPACE_CACHE
              value: /tmp/minder-workspaces
            - name: MINDER_SANDBOX_SCRATCH
              value: /sandbox-scratch
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 1
              memory: 512Mi
          startupProbe:
            exec:
              command:
                - node
                - --input-type=commonjs
                - -e
                - "const s=require('net').createConnection('/run/minder-sandbox/runner.sock');s.once('connect',()=>{s.end();process.exit(0)});s.once('error',()=>process.exit(1))"
            periodSeconds: 2
            timeoutSeconds: 2
            failureThreshold: 60
          readinessProbe:
            exec:
              command:
                - node
                - --input-type=commonjs
                - -e
                - "const s=require('net').createConnection('/run/minder-sandbox/runner.sock');s.once('connect',()=>{s.end();process.exit(0)});s.once('error',()=>process.exit(1))"
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 2
          livenessProbe:
            exec:
              command:
                - node
                - --input-type=commonjs
                - -e
                - "const s=require('net').createConnection('/run/minder-sandbox/runner.sock');s.once('connect',()=>{s.end();process.exit(0)});s.once('error',()=>process.exit(1))"
            periodSeconds: 30
            timeoutSeconds: 2
            failureThreshold: 3
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            allowPrivilegeEscalation: false
            appArmorProfile:
              type: Unconfined
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
            # Bubblewrap creates nested namespaces; the pod-level RuntimeDefault profile denies unshare.
            seccompProfile:
              type: Unconfined
          volumeMounts:
            - name: tmp-runner
              mountPath: /tmp
            - name: workspace-cache
              mountPath: /tmp/minder-workspaces
            - name: sandbox-socket
              mountPath: /run/minder-sandbox
            - name: sandbox-scratch
              mountPath: /sandbox-scratch

      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 128Mi
        - name: home
          emptyDir:
            sizeLimit: 64Mi
        - name: workspace-cache
          emptyDir:
            sizeLimit: 2Gi
        - name: sandbox-socket
          emptyDir:
            sizeLimit: 16Mi
        - name: tmp-runner
          emptyDir:
            sizeLimit: 128Mi
        - name: sandbox-scratch
          emptyDir:
            sizeLimit: 256Mi
