# Throwaway Postgres and MinIO for the TypeScript persistence and API E2E tests.
#
# Deliberately separate from the stack in ../minder-py/docker-compose.yml: those
# databases (`db`, `blackboard-db`) hold real development data, and these tests
# write and delete rows. Nothing here shares a volume, a port, or a network with
# them.
#
#   cd minder-agent
#   docker compose -f docker-compose.test.yml up -d
#   export MINDER_TEST_DATABASE_URL=postgres://minder:minder@127.0.0.1:5433/minder_test
#   export MINDER_TEST_MINIO_PORT=9001
#   # A destructive reset is only for this throwaway database:
#   # DATABASE_URL="$MINDER_TEST_DATABASE_URL" MINDER_RESET_CONFIRM=DROP_MINDER_RUST_DATA npm run db:reset:minder
#   npm run test:phase-4
#   docker compose -f docker-compose.test.yml down
#
# Without MINDER_TEST_DATABASE_URL set, the Postgres/E2E tests skip and the rest
# of the suite runs unchanged.

name: minder-agent-test

services:
  test-db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_DB=minder_test
      - POSTGRES_USER=minder
      - POSTGRES_PASSWORD=minder
      # The tests own this database completely, so trust local connections and
      # skip password hashing round trips.
      - POSTGRES_HOST_AUTH_METHOD=trust
    ports:
      # 5433, not 5432: the development stack may already hold the default port,
      # and a test run must never silently land on the wrong database.
      #
      # Overridable because 5433 is not always free either — if another service
      # holds the port, this container fails to bind.  That surfaces as
      # `database "minder_test" does not exist` panics rather than as a port
      # conflict, so if you see those, check what holds the port before anything
      # else:
      #
      #   docker ps --format '{{.Names}} {{.Ports}}' | grep 5433
      #   export MINDER_TEST_DB_PORT=5434
      #   docker compose -f docker-compose.test.yml up -d
      #   export MINDER_TEST_DATABASE_URL=postgres://minder:minder@127.0.0.1:5434/minder_test
      - "127.0.0.1:${MINDER_TEST_DB_PORT:-5433}:5432"
    # No named volume. State lives in a tmpfs, so `down` leaves nothing behind
    # and every `up` starts from an empty database — which is what a test
    # fixture should be. It is also markedly faster than a disk-backed volume.
    tmpfs:
      - /var/lib/postgresql/data
    command:
      - postgres
      # Durability buys nothing for a database that is discarded on shutdown,
      # and turning it off removes fsync from the test inner loop.
      - -c
      - fsync=off
      - -c
      - full_page_writes=off
      - -c
      - synchronous_commit=off
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U minder -d minder_test"]
      interval: 2s
      timeout: 3s
      retries: 15

  test-minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data
    environment:
      MINIO_ROOT_USER: minder-test
      MINIO_ROOT_PASSWORD: minder-test-password
    ports:
      - "127.0.0.1:${MINDER_TEST_MINIO_PORT:-9001}:9000"
    tmpfs:
      - /data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 2s
      timeout: 3s
      retries: 15

  test-minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      test-minio:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        /usr/bin/mc alias set local http://test-minio:9000 minder-test minder-test-password
        /usr/bin/mc mb --ignore-existing local/minder-workspace
