steps:
  - name: node:22.19.0-bookworm-slim
    id: node-tests
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        npm ci --ignore-scripts
        DATABASE_URL=postgresql://minder:minder@127.0.0.1:5433/minder_test \
          npx prisma generate --schema src/infrastructure/prisma/schema.prisma
        npm run test:compat
        npm run test:phase-0 -- src/tests/presentation/http
        npm run test:phase-0 -- src/tests/phase-0/cloudbuild.test.ts src/tests/phase-0/sandbox-deployment.test.ts
        npm ci --ignore-scripts --prefix sandbox-runner
        npm test --prefix sandbox-runner
        npm run check
        npm run build

  - name: gcr.io/cloud-builders/docker
    id: image-smoke
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        docker build --tag minder-serve:phase-0-verify .
        bash src/tests/phase-0/container-smoke.sh minder-serve:phase-0-verify
        docker build --tag minder-sandbox-runner:phase-0-verify -f sandbox-runner/Dockerfile .
        bash src/tests/phase-0/sandbox-container-smoke.sh minder-sandbox-runner:phase-0-verify

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    id: manifest-validation
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        kubectl kustomize k8s/overlays/gcp-dev > /workspace/minder-gcp-dev.yaml
        python3 -m unittest discover -s k8s/ci -p '*_test.py'
        kubectl kustomize k8s/overlays/gcp-prod > /workspace/minder-gcp-prod.yaml
        kubectl apply --dry-run=client --validate=false -f /workspace/minder-gcp-dev.yaml >/dev/null
        kubectl apply --dry-run=client --validate=false -f /workspace/minder-gcp-prod.yaml >/dev/null

options:
  logging: CLOUD_LOGGING_ONLY

timeout: 1800s
