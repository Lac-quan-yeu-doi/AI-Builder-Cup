# Development-only verification. Publishes one immutable runner image and runs
# a secret-free Job; never applies Agent configuration, migration or Deployment.
steps:
  - name: node:22.19.0-bookworm-slim
    id: runner-tests
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        test '${PROJECT_ID}' = cosmos3-mmad-research
        npm ci --ignore-scripts --prefix sandbox-runner
        npm test --prefix sandbox-runner

  - name: gcr.io/cloud-builders/docker
    id: runner-image
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        IMAGE="asia-southeast1-docker.pkg.dev/${PROJECT_ID}/celesnity-gcp-dev-apps/minder-sandbox-runner:sandbox-verify-${BUILD_ID}"
        docker build --pull --tag "$$IMAGE" -f sandbox-runner/Dockerfile .
        bash src/tests/phase-0/sandbox-container-smoke.sh "$$IMAGE"
        docker push "$$IMAGE"

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    id: verify-sandbox-on-gke
    entrypoint: bash
    env:
      - USE_GKE_GCLOUD_AUTH_PLUGIN=True
    args:
      - -c
      - |
        set -euo pipefail
        gcloud container clusters get-credentials celesnity-gcp-dev \
          --zone asia-southeast1-a --project '${PROJECT_ID}'
        kubectl get namespace minder >/dev/null
        python3 -m unittest discover -s k8s/ci -p '*_test.py'
        IMAGE="asia-southeast1-docker.pkg.dev/${PROJECT_ID}/celesnity-gcp-dev-apps/minder-sandbox-runner"
        sed -i -E "s|^    newTag:.*|    newTag: \"sandbox-verify-${BUILD_ID}\"|" \
          k8s/overlays/gcp-dev/kustomization.yaml
        kubectl kustomize k8s/overlays/gcp-dev > /workspace/minder-rendered.yaml
        awk -f k8s/ci/extract-deployment.awk /workspace/minder-rendered.yaml > /workspace/minder-deployment.yaml
        kubectl create --dry-run=client --validate=false -f /workspace/minder-deployment.yaml \
          -o json > /workspace/minder-resources.json
        job_name="minder-sandbox-$$(printf '%s' '${BUILD_ID}' | cut -c1-8)"
        python3 k8s/ci/render-sandbox-verification-job.py "$$job_name" \
          < /workspace/minder-resources.json > /workspace/minder-sandbox-job.json
        kubectl create -f /workspace/minder-sandbox-job.json
        if ! kubectl -n minder wait --for=condition=complete "job/$$job_name" --timeout=150s; then
          bash k8s/ci/deployment-diagnostics.sh minder "job-name=$$job_name"
          exit 1
        fi
        kubectl -n minder logs "job/$$job_name" --all-containers=true
        echo "==> GKE sandbox verified: $$IMAGE:sandbox-verify-${BUILD_ID}"

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8
timeout: 1200s
