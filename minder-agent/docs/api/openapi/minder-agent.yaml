              schema:
                $ref: "#/components/schemas/ApiErrorV2Response"
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
        "404":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorV2Response"
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
        default:
          description: Error response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorV2Response"
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
      tags:
        - Runs
      security:
        - owner: []
  /api/v2/agent-manifests/governance/validate:
    post:
      operationId: GovernanceV2Controller_validate_v2
      parameters:
        - name: X-Request-Id
          in: header
          required: false
          description: Optional request correlation ID.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GovernanceValidationDto"
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GovernanceValidationV2Response"
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
        "400":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorV2Response"
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
        "401":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorV2Response"
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
        "403":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorV2Response"
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
        default:
          description: Error response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorV2Response"
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
      tags:
        - Governance
      security:
        - owner: []
info:
  title: Minder Agent API
  description: Versioned HTTP API for agent runs and workspace resources.
  version: 2.0.0
  contact: {}
tags:
  - name: Runs
    description: Run admission, sessions, status, and events
  - name: Governance
    description: Manifest and run governance
servers: []
components:
  securitySchemes:
    owner:
      scheme: bearer
      bearerFormat: JWT
      type: http
      description: Verified Core owner assertion
    webhookSignature:
      type: apiKey
      in: header
      name: x-minder-signature
      description: HMAC SHA-256 signature over the raw request body
  schemas:
    CreateAgentDto:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        displayName:
          type: string
        systemPrompt:
          type: string
        model:
          type: string
        toolAllowlist:
          type: array
          items:
            type: string
        skills:
          type: array
          items:
            type: string
        maxSteps:
          type: number
          minimum: 1
        executionStrategy:
          type: string
          enum:
            - react
      required:
        - id
        - name
        - toolAllowlist
        - skills
        - executionStrategy
    UpdateAgentDto:
      type: object
      properties:
        name:
          type: string
        displayName:
          type: string
        systemPrompt:
          type: string
        model:
          type: string
        toolAllowlist:
          type: array
          items:
            type: string
        skills:
          type: array
          items:
            type: string
        maxSteps:
          type: number
          minimum: 1
        executionStrategy:
          type: string
          enum:
            - react
    RollbackAgentDto:
      type: object
      properties:
        version:
          type: number
          minimum: 1
      required:
        - version
    AgentV2Response:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        display_name:
          type: string
        system_prompt:
          type: string
        model:
          type: string
        tool_allowlist:
          type: array
          items:
            type: string
        skills:
          type: array
          items:
            type: string
        max_steps:
          type: number
        execution_strategy:
          type: string
          enum:
            - react
        archived_at:
          type: string
          format: date-time
        version:
          type: number
      required:
        - id
        - name
        - tool_allowlist
        - skills
        - execution_strategy
        - version
    ApiErrorV2Response:
      type: object
      properties:
        error:
          type: string
          example: invalid_turn
        request_id:
          type: string
        active_run_id:
          type: string
          description: Active run ID for conflict responses.
      required:
        - error
        - request_id
    CreateAgentV2Dto:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        display_name:
          type: string
        system_prompt:
          type: string
        model:
          type: string
        tool_allowlist:
          type: array
          items:
            type: string
        skills:
          type: array
          items:
            type: string
        max_steps:
          type: number
          minimum: 1
        execution_strategy:
          type: string
          enum:
            - react
      required:
        - id
        - name
        - tool_allowlist
        - skills
        - execution_strategy
    UpdateAgentV2Dto:
      type: object
      properties:
        name:
          type: string
        display_name:
          type: string
        system_prompt:
          type: string
        model:
          type: string
        tool_allowlist:
          type: array
          items:
            type: string
        skills:
          type: array
          items:
            type: string
        max_steps:
          type: number
          minimum: 1
        execution_strategy:
          type: string
          enum:
            - react
    AgentV2DiffResponse:
      type: object
      properties:
        path:
          type: string
        from:
          oneOf:
            - type: string
            - type: number
            - type: array
              items:
                type: string
        to:
          oneOf:
            - type: string
            - type: number
            - type: array
              items:
                type: string
      required:
        - path
    GovernanceValidationDto:
      type: object
      properties:
        yaml:
          type: string
      required:
        - yaml
    SkillSummaryResponse:
      type: object
      properties:
        name:
          type: string
        namespace:
          type: string
        description:
          type: string
        read_only:
          type: boolean
        source:
          type: string
          enum: &a14
            - global
            - project
      required:
        - name
        - namespace
        - read_only
        - source
    SkillDto:
      type: object
      properties:
        name:
          type: string
        namespace:
          type: string
        body:
          type: string
        description:
          type: string
    SkillResponse:
      type: object
      properties:
        name:
          type: string
        namespace:
          type: string
        description:
          type: string
        read_only:
          type: boolean
        source:
          type: string
          enum: *a14
        body:
          type: string
        hash:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
        - name
        - namespace
        - read_only
        - source
        - body
        - hash
        - created_at
        - updated_at
    ApprovalDecisionDto:
      type: object
      properties:
        decision:
          type: string
          enum:
            - approved
            - denied
      required:
        - decision
    TurnDto:
      type: object
      properties: {}
    ClientToolResultDto:
      type: object
      properties: {}
    RoomCreateDto:
      type: object
      properties:
        name:
          type: string
        key:
          type: string
        max_concurrent_runs:
          type: number
          minimum: 1
        max_queued:
          type: number
          minimum: 0
        members:
          type: array
          items:
            type: string
      required:
        - name
        - max_concurrent_runs
        - members
    RoomMemberDto:
      type: object
      properties:
        agent:
          type: string
      required:
        - agent
    RoomWebhookDto:
      type: object
      properties:
        agent:
          type: string
        source:
          type: string
        secret_ref:
          type: string
      required:
        - agent
        - source
        - secret_ref
    RoomRunDto:
      type: object
      properties:
        run_id:
          type: string
          format: uuid
        agent:
          type: string
        input:
          type: string
        kind:
          type: string
        context:
          type: object
        data_scope:
          type: object
      required:
        - agent
        - input
    RoomWebhookEventDto:
      type: object
      properties:
        input:
          type: string
        data_scope:
          type: object
    CompletedRunResponse:
      type: object
      properties:
        request_id:
          type: string
        error:
          type: string
          nullable: true
        response_text:
          type: string
          nullable: true
        data_scope:
          type: object
          nullable: true
        run_id:
          type: string
        session_id:
          type: string
        status:
          type: string
      required:
        - request_id
        - error
        - response_text
        - data_scope
        - run_id
        - session_id
        - status
    DuplicateDeliveryResponse:
      type: object
      properties:
        request_id:
          type: string
        status:
          type: string
          enum:
            - duplicate_delivery
      required:
        - request_id
        - status
    CreateRunRequest:
      type: object
      properties:
        run_id:
          type: string
          format: uuid
        session_key:
          type: string
        input:
          type: string
        agent:
          type: string
        data_scope:
          type: object
        automation_context:
          type: object
        system_prompt:
          type: string
        wait_ms:
          type: number
          minimum: 0
      required:
        - session_key
        - input
    StartedRunResponse:
      type: object
      properties:
        request_id:
          type: string
        run_id:
          type: string
        session_id:
          type: string
        events_url:
          type: string
      required:
        - request_id
        - run_id
        - session_id
        - events_url
    SessionV2Response:
      type: object
      properties:
        id:
          type: string
        key:
          type: string
        mode:
          type: string
        turns:
          type: number
          minimum: 0
        pending_question:
          type: object
          nullable: true
        pending_client_tool:
          type: object
          nullable: true
        pending_plan:
          type: object
          nullable: true
        pending_approval:
          type: object
          nullable: true
      required:
        - id
        - mode
        - turns
        - pending_question
        - pending_client_tool
        - pending_plan
        - pending_approval
    SubmitToolResultRequest:
      type: object
      properties:
        session_key:
          type: string
        tool_call_id:
          type: string
        content:
          type: string
        is_error:
          type: boolean
      required:
        - tool_call_id
        - content
    StreamOpenedEvent:
      type: object
      properties:
        request_id:
          type: string
        run_id:
          type: string
        cursor:
          type: string
      required:
        - request_id
        - run_id
        - cursor
    GovernanceValidationV2Response:
      type: object
      properties:
        valid:
          type: boolean
          enum:
            - true
        policy_revision:
          type: string
        admitted_at:
          type: string
          format: date-time
        policy:
          type: object
      required:
        - valid
        - policy_revision
        - admitted_at
        - policy
    RunStatusV2Response:
      type: object
      required:
        - run_id
        - status
        - session_id
        - finished_at
        - response_text
        - data_scope
        - error
      properties:
        run_id:
          type: string
        status:
          type: string
        session_id:
          type: string
        finished_at:
          type: string
          nullable: true
        response_text:
          type: string
          nullable: true
        data_scope:
          type: object
          nullable: true
          additionalProperties: true
        error:
          type: string
          nullable: true
    RoomV2Response:
      type: object
      required:
        - id
        - name
        - max_concurrent_runs
        - max_queued
        - status
        - members
        - created_at
      properties:
        id:
          type: string
        name:
          type: string
        key:
          type: string
        max_concurrent_runs:
          type: integer
        max_queued:
          type: integer
        status:
          type: string
        members:
          type: array
          items:
            type: string
        created_at:
          type: string
    RoomListV2Response:
      type: array
      items:
        $ref: "#/components/schemas/RoomV2Response"
    RoomWebhookV2Response:
      type: object
      required:
        - id
        - room_id
        - agent
        - source
        - secret_ref
        - created_at
      properties:
        id:
          type: string
        room_id:
          type: string
        agent:
          type: string
        source:
          type: string
        secret_ref:
          type: string
        created_at:
          type: string
    RoomWebhookListV2Response:
      type: array
      items:
        $ref: "#/components/schemas/RoomWebhookV2Response"
    RoomHistoryV2Response:
      type: object
      required:
        - room_id
        - runs
        - truncated
      properties:
        room_id:
          type: string
        runs:
          type: array
          items:
            type: object
        truncated:
          type: boolean
    RoomMetricsV2Response:
      type: object
      required:
        - total
        - succeeded
        - failed
        - cancelled
        - skipped
        - running
        - p50DurationMs
        - p95DurationMs
      properties:
        total:
          type: integer
        succeeded:
          type: integer
        failed:
          type: integer
        cancelled:
          type: integer
        skipped:
          type: integer
        running:
          type: integer
        p50DurationMs:
          type: number
          nullable: true
        p95DurationMs:
          type: number
          nullable: true
    RoomRunV2Response:
      oneOf:
        - type: object
          required:
            - run_id
            - session_id
            - room_id
            - events_url
            - room_events_url
            - queue_position
            - request_id
          properties:
            run_id:
              type: string
            session_id:
              type: string
            room_id:
              type: string
            events_url:
              type: string
            room_events_url:
              type: string
            queue_position:
              type: integer
            request_id:
              type: string
        - $ref: "#/components/schemas/DuplicateDeliveryResponse"
    RoomWebhookAdmissionV2Response:
      oneOf:
        - type: object
          required:
            - run_id
            - room_id
            - request_id
          properties:
            run_id:
              type: string
            room_id:
              type: string
            request_id:
              type: string
        - $ref: "#/components/schemas/DuplicateDeliveryResponse"
    RoomTranscriptV2Response:
      type: object
      required:
        - id
        - history
      properties:
        id:
          type: string
        history:
          type: array
          items:
            type: object
  headers:
    X-Request-Id:
      description: Correlation ID returned with every HTTP response.
      schema:
        type: string
