apiVersion: apps/v1
kind: Deployment
metadata:
  name: mqtt-bronze-stream-shared-0
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: mqtt-bronze-stream
      celesnity.io/streaming-deployment: shared-0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mqtt-bronze-stream
        app.kubernetes.io/component: bronze-writer
        celesnity.io/streaming-deployment: shared-0
    spec:
      serviceAccountName: celesnity-spark-runtime
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 120
      nodeSelector:
        celesnity-io-pool: redpanda
      tolerations:
        - key: celesnity.io/workload
          operator: Equal
          value: redpanda
          effect: NoSchedule
      securityContext:
        runAsNonRoot: true
        runAsUser: 185
        fsGroup: 185
      containers:
        - name: driver
          image: celesnity/spark:3.5.7-iceberg-1.11.0
          imagePullPolicy: Always
          command:
            - /opt/spark/bin/spark-submit
            - --master
            - spark://spark-master:7077
            - --deploy-mode
            - client
            - --driver-memory
            - 1g
            - --executor-memory
            - 1g
            - --executor-cores
            - "1"
            - --conf
            - spark.cores.max=1
            - --conf
            - spark.driver.port=7078
            - --conf
            - spark.blockManager.port=7079
            - /opt/celesnity/streaming/mqtt_bronze_stream.py
          env:
            - name: STREAMING_DEPLOYMENT_ID
              value: shared-0
            - name: SPARK_DRIVER_HOST
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: REDPANDA_RAW_TOPIC
              value: celesnity.mqtt.raw.shared-0.v1
            - name: REDPANDA_BOOTSTRAP_SERVERS
              valueFrom:
                secretKeyRef: { name: celesnity-streaming, key: REDPANDA_BROKERS }
            - name: REDPANDA_SECURITY_PROTOCOL
              valueFrom:
                secretKeyRef: { name: celesnity-streaming, key: REDPANDA_SECURITY_PROTOCOL }
            - name: WAREHOUSE_PATH
              valueFrom:
                configMapKeyRef: { name: celesnity-storage, key: WAREHOUSE_S3_PATH }
            - name: POSTGRES_SSLMODE
              value: require
            - name: STREAMING_TRIGGER_INTERVAL
              value: 30 seconds
          envFrom:
            - secretRef: { name: celesnity-database }
            - secretRef: { name: celesnity-streaming }
            - configMapRef: { name: celesnity-storage }
          resources:
            requests: { cpu: 250m, memory: 1Gi }
            limits: { memory: 1536Mi }
          volumeMounts:
            - name: streaming-script
              mountPath: /opt/celesnity/streaming
              readOnly: true
            - name: ivy
              mountPath: /opt/spark/ivy
            - name: work
              mountPath: /opt/spark/work
      volumes:
        - name: streaming-script
          configMap: { name: mqtt-bronze-stream-script }
        - name: ivy
          emptyDir: {}
        - name: work
          emptyDir: {}
