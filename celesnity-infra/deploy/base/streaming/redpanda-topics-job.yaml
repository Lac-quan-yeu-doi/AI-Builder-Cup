apiVersion: batch/v1
kind: Job
metadata:
  name: redpanda-topics-v2
spec:
  backoffLimit: 10
  template:
    metadata:
      labels:
        app.kubernetes.io/name: redpanda-topic-bootstrap
    spec:
      serviceAccountName: celesnity-redpanda-bootstrap
      automountServiceAccountToken: false
      restartPolicy: OnFailure
      containers:
        - name: rpk
          image: docker.redpanda.com/redpandadata/redpanda:v26.1.14
          command: ["/bin/bash", "-ceu"]
          args:
            - |
              RPK=(-X brokers="$REDPANDA_BROKERS" -X user="$REDPANDA_USERNAME" -X pass="$REDPANDA_PASSWORD" -X sasl.mechanism=SCRAM-SHA-256)
              if [ "$REDPANDA_TLS_ENABLED" = "true" ]; then
                RPK+=(-X tls.enabled=true -X tls.ca=/etc/redpanda/tls/ca.crt)
              fi
              rpk topic create celesnity.streaming.control.v1 --partitions 3 --replicas "$REDPANDA_REPLICATION_FACTOR" --topic-config cleanup.policy=compact "${RPK[@]}" || true
              rpk topic create celesnity.mqtt.raw.shared-0.v1 --partitions 48 --replicas "$REDPANDA_REPLICATION_FACTOR" --topic-config retention.ms=604800000 "${RPK[@]}" || true
              rpk topic alter-config celesnity.mqtt.raw.shared-0.v1 --set retention.ms=604800000 --no-confirm "${RPK[@]}"
              rpk topic create celesnity.mqtt.dlq.v1 --partitions 12 --replicas "$REDPANDA_REPLICATION_FACTOR" --topic-config retention.ms=604800000 "${RPK[@]}" || true
              rpk topic create celesnity.streaming.audit.v1 --partitions 12 --replicas "$REDPANDA_REPLICATION_FACTOR" --topic-config retention.ms=2592000000 "${RPK[@]}" || true
          envFrom:
            - secretRef:
                name: celesnity-streaming
          volumeMounts:
            - name: redpanda-ca
              mountPath: /etc/redpanda/tls
              readOnly: true
      volumes:
        - name: redpanda-ca
          secret:
            secretName: celesnity-streaming
            items:
              - key: ca.crt
                path: ca.crt
            defaultMode: 0444
