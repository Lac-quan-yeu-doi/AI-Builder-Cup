---
# MCP Trino: a network-accessible MCP server exposing Trino tools over SSE.
#
# Wraps the txn2/mcp-trino stdio binary with `supergateway` to serve it over
# HTTP/SSE so external clients (Claude Desktop, Codex, other agents) can
# connect without running the binary locally.
#
# Domain: mcp-trino-dev.celesnity.com
# Protocol: SSE (Server-Sent Events) over HTTPS
# Clients connect to: https://mcp-trino-dev.celesnity.com/sse
apiVersion: v1
kind: Service
metadata:
  name: mcp-trino
  labels:
    app.kubernetes.io/name: mcp-trino
    app.kubernetes.io/component: mcp-server
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: mcp-trino
    app.kubernetes.io/component: mcp-server
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-trino
  labels:
    app.kubernetes.io/name: mcp-trino
    app.kubernetes.io/component: mcp-server
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mcp-trino
      app.kubernetes.io/component: mcp-server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mcp-trino
        app.kubernetes.io/component: mcp-server
    spec:
      serviceAccountName: celesnity-mcp-trino
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        # Needed to read the trino-ca Secret volume below: without it the mount
        # stays root-owned at mode 0400 and this non-root container gets EACCES,
        # which crypto/x509 turns into an empty trust store, not a load error.
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: mcp-trino
          # supergateway wraps any stdio MCP server as an SSE HTTP endpoint.
          # It spawns the command specified in --stdio and bridges JSON-RPC
          # over stdin/stdout to SSE over HTTP.
          image: supercorp/supergateway:latest
          args:
            - --stdio
            - /shared/mcp-trino
            - --port
            - "8080"
            - --host
            - "0.0.0.0"
            - --healthEndpoint
            - /healthz
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            # Trino connection — same coordinator as the rest of the platform.
            - name: TRINO_HOST
              value: "trino-coordinator.celesnity.svc.cluster.local"
            - name: TRINO_PORT
              value: "8443"
            - name: TRINO_USER
              value: "celesnity"
            - name: TRINO_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: trino-client
                  key: password
                  # ponytail: required, not optional — the coordinator has PASSWORD auth
                  # on always, so a missing key is a misconfiguration, not a valid state.
                  # optional:true let the pod start healthy with no password and only
                  # fail on the first real query as an opaque 401.
            - name: TRINO_SSL
              value: "true"
            # ponytail: TRINO_SSL_VERIFY is a no-op — the vendored trino-go-client
            # dropped InsecureSkipVerify; it only supports a custom CA via
            # SSLCert/SSLCertPath (not exposed as an env var here) or, absent
            # that, Go's default HTTP client against the system root store.
            # SSL_CERT_FILE below is what actually makes the coordinator's
            # self-signed cert trusted: it's the Go stdlib convention
            # x509.SystemCertPool() reads, so no app-level flag is needed.
            - name: SSL_CERT_FILE
              value: "/etc/trino/ca/ca.crt"
            - name: TRINO_CATALOG
              value: "iceberg"
            - name: TRINO_SCHEMA
              value: "default"
            # Extensions
            - name: MCP_TRINO_EXT_READONLY
              value: "true"
            - name: MCP_TRINO_EXT_LOGGING
              value: "true"
            - name: MCP_TRINO_EXT_ERRORS
              value: "true"

          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi

          volumeMounts:
            - name: shared-bin
              mountPath: /shared
              readOnly: true
            - name: trino-ca
              mountPath: /etc/trino/ca
              readOnly: true

          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 12
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 30
            timeoutSeconds: 3
            failureThreshold: 3

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]

      # The supergateway image needs the mcp-trino binary available in PATH.
      # We use an init container to copy it from the official image.
      initContainers:
        - name: copy-mcp-trino
          image: ghcr.io/txn2/mcp-trino:latest
          command: ["cp", "/usr/local/bin/mcp-trino", "/shared/mcp-trino"]
          volumeMounts:
            - name: shared-bin
              mountPath: /shared
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop: ["ALL"]

      volumes:
        - name: shared-bin
          emptyDir:
            sizeLimit: 32Mi
        # The certificate WITHOUT the private key — same source celesnity-core
        # uses via NODE_EXTRA_CA_CERTS, see trino-auth.tf's trino_client Secret.
        - name: trino-ca
          secret:
            secretName: trino-client
            defaultMode: 0400
            items:
              - key: ca.crt
                path: ca.crt
