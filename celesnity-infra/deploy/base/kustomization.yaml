apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# This base is not deployable on its own, and everything in it is cloud-neutral.
# An overlay supplies the three things that are not:
#
#   1. the namespace
#   2. the Iceberg catalog (MinIO vs S3 vs GCS)
#   3. any load balancer, since Ingress annotations are cloud-specific
#
#   make deploy CLOUD=gcp ENV=dev
#   make deploy CLOUD=gcp ENV=prod

resources:
  - trino/coordinator.yaml
  - trino/worker.yaml
  - mcp-trino/deployment.yaml
  - spark/master.yaml
  - spark/worker.yaml
  # Makes Iceberg deletions actually take effect. Without it, immutable snapshots
  # keep deleted rows readable through time travel indefinitely.
  - maintenance/iceberg-cronjob.yaml
  - streaming/redpanda-connect.yaml
  - streaming/mqtt-bronze-stream.yaml
  - streaming/redpanda-topics-job.yaml

# Generated from the same files the local Compose stack bind-mounts, so there is
# one source of truth for Trino configuration. Reading from outside this
# directory requires kustomize's load restrictor to be relaxed:
#
#   kubectl kustomize --load-restrictor LoadRestrictionsNone deploy/overlays/<cloud>-dev
#
# The Makefile passes that flag; `make deploy` is the supported entrypoint.
configMapGenerator:
  - name: trino-node-config
    files:
      - node.properties=../../config/trino/node.properties

  # Coordinator and worker config come from trino/config/ in this directory, NOT
  # from the shared config/trino/. Cloud deployments require password auth over
  # TLS; local Compose stays unauthenticated over plain HTTP. See the comment at
  # the top of trino/config/coordinator.properties.
  #
  # node.properties and access-control.properties remain shared — they are
  # identical in both environments.
  - name: trino-coordinator-config
    files:
      - config.properties=trino/config/coordinator.properties
      - password-authenticator.properties=trino/config/password-authenticator.properties
      - access-control.properties=../../config/trino/access-control.properties
      - access-control-rules.json=../../config/trino/access-control-rules.json

  - name: trino-worker-config
    files:
      - config.properties=trino/config/worker.properties

  # Shared with nothing else, but kept in config/ rather than inlined so the script
  # is editable and reviewable as Python rather than as embedded YAML.
  - name: iceberg-maintenance-script
    files:
      - iceberg-maintenance.py=../../config/spark/iceberg-maintenance.py

  - name: mqtt-bronze-stream-script
    files:
      - mqtt_bronze_stream.py=../../config/spark/mqtt_bronze_stream.py

  - name: redpanda-connect-root
    files:
      - root.yaml=../../config/redpanda-connect/root.yaml

  - name: redpanda-connect-mqtt-stream
    files:
      - mqtt-to-redpanda.yaml=../../config/redpanda-connect/mqtt-to-redpanda.yaml


# Name suffix hashing is left enabled on purpose: editing a properties file
# produces a new ConfigMap name, which Kustomize propagates into the Deployments
# and thereby triggers a rollout. Without it, config edits would silently not
# reach running pods.

labels:
  - pairs:
      app.kubernetes.io/part-of: celesnity
    includeSelectors: false
