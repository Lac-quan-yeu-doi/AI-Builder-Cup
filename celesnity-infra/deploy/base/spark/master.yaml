---
# Keep the client address stable across master pod replacements. The master
# binds to its own POD_IP below, while workers and drivers use this ClusterIP.
# A headless Service exposed the changing pod IP through DNS; Spark's JVM cached
# that address during rollouts and workers remained disconnected for minutes.
apiVersion: v1
kind: Service
metadata:
  name: spark-master
  labels:
    app.kubernetes.io/name: spark
    app.kubernetes.io/component: master
spec:
  selector:
    app.kubernetes.io/name: spark
    app.kubernetes.io/component: master
  ports:
    - name: rpc
      port: 7077
      targetPort: rpc
      protocol: TCP
    - name: ui
      port: 8080
      targetPort: ui
      protocol: TCP

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: spark-master
  labels:
    app.kubernetes.io/name: spark
    app.kubernetes.io/component: master
spec:
  replicas: 1
  # A second master would register a competing cluster under the same DNS name.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: spark
      app.kubernetes.io/component: master
  template:
    metadata:
      labels:
        app.kubernetes.io/name: spark
        app.kubernetes.io/component: master
    spec:
      serviceAccountName: celesnity-spark-runtime
      automountServiceAccountToken: false
      # A Service named spark-master would otherwise inject
      # SPARK_MASTER_PORT=tcp://<cluster-ip>:7077. Spark interprets that variable
      # as an integer and crash-loops before honoring the explicit command args.
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 185
        fsGroup: 185
      containers:
        - name: spark
          # Overridden by kustomization.yaml `images:` with the ECR URL.
          image: celesnity/spark:3.5.7-iceberg-1.11.0
          imagePullPolicy: Always
          command: ["/bin/bash", "/opt/celesnity/start-master.sh"]
          ports:
            - name: rpc
              containerPort: 7077
            - name: ui
              containerPort: 8080
          env:
            - name: SPARK_MASTER_HOST
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: SPARK_MASTER_INTERNAL_PORT
              value: "7077"
            # Endpoint and credentials absent by design: real S3, credentials
            # served by the EKS Pod Identity Agent.
            - name: AWS_ENDPOINT_URL
              value: ""
            - name: WAREHOUSE_PATH
              valueFrom:
                configMapKeyRef:
                  name: celesnity-storage
                  key: WAREHOUSE_S3_PATH
          envFrom:
            - secretRef:
                name: celesnity-database
            - configMapRef:
                name: celesnity-storage
          resources:
            requests:
              cpu: 100m
              memory: 384Mi
            limits:
              memory: 640Mi
          readinessProbe:
            tcpSocket:
              port: rpc
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 10
          livenessProbe:
            tcpSocket:
              port: rpc
            initialDelaySeconds: 45
            periodSeconds: 20
            failureThreshold: 6
          volumeMounts:
            - name: ivy
              mountPath: /opt/spark/ivy
            - name: work
              mountPath: /opt/spark/work
      volumes:
        - name: ivy
          emptyDir: {}
        - name: work
          emptyDir: {}
