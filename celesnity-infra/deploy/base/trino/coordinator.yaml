---
# ClusterIP name must stay "trino-coordinator" to match the discovery.uri in
# both the coordinator and worker ConfigMaps.
apiVersion: v1
kind: Service
metadata:
  name: trino-coordinator
  labels:
    app.kubernetes.io/name: trino
    app.kubernetes.io/component: coordinator
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: trino
    app.kubernetes.io/component: coordinator
  ports:
    # Workers reach discovery here; the shared secret authenticates it.
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
    # Clients connect here. Port-forward this one:
    #   kubectl -n celesnity port-forward svc/trino-coordinator 8443:8443
    #   trino --server https://localhost:8443 --user celesnity --password --insecure
    - name: https
      port: 8443
      targetPort: https
      protocol: TCP
      # Declares that this port speaks TLS, which is true on every target. A GKE
      # Gateway reads this to decide whether to re-encrypt load balancer traffic to
      # the pod; without it the backend service is built as plaintext HTTP against
      # a TLS port and every request fails the handshake as a 502, while the
      # separate HTTPS health check keeps reporting the backend HEALTHY.
      #
      # Lives here rather than in the GCP overlay for two reasons: it is a plain
      # Kubernetes field rather than a cloud annotation, and kustomize's bundled
      # Service schema does not recognise appProtocol, so a strategic-merge patch
      # setting it is silently dropped.
      appProtocol: HTTPS

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: trino-coordinator
  labels:
    app.kubernetes.io/name: trino
    app.kubernetes.io/component: coordinator
spec:
  replicas: 1
  # Only one coordinator may run at a time: two would both host discovery and
  # split the cluster. Recreate avoids a second pod during rollout.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: trino
      app.kubernetes.io/component: coordinator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: trino
        app.kubernetes.io/component: coordinator
    spec:
      # ServiceAccount created by Terraform and bound to an IAM role by an EKS
      # pod identity association. That association is what grants S3 access;
      # there is no annotation here and no stored credential anywhere.
      serviceAccountName: celesnity-trino
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: trino
          image: trinodb/trino:483
          ports:
            # Internal only: discovery and worker RPC, guarded by the shared secret.
            - name: http
              containerPort: 8080
            # Client-facing: password auth over TLS.
            - name: https
              containerPort: 8443
          envFrom:
            - secretRef:
                name: celesnity-database
            - configMapRef:
                name: celesnity-storage
          # config.properties is shared with the Compose stack and resolves these
          # through Trino's ${ENV:...} substitution. Keep
          # TRINO_QUERY_MAX_MEMORY_PER_NODE below (heap - 30% headroom); the
          # container jvm.config sets heap to 80% of the memory limit below.
          #
          # TRINO_QUERY_MAX_MEMORY is the aggregate across workers, so it tracks
          # the trino-worker replica count: 1 worker x 600MB. Raise both together.
          env:
            - name: TRINO_QUERY_MAX_MEMORY
              value: 600MB
            - name: TRINO_QUERY_MAX_MEMORY_PER_NODE
              value: 600MB
            # Must be identical on the workers or they never register. Generated by
            # Terraform into the trino-auth Secret.
            - name: TRINO_SHARED_SECRET
              valueFrom:
                secretKeyRef:
                  name: trino-auth
                  key: shared-secret
          resources:
            requests:
              cpu: 300m
              memory: 1Gi
            limits:
              # No CPU limit: capping CPU causes scheduler throttling that shows
              # up as query latency. Memory is limited because it drives the heap.
              memory: 1536Mi
          readinessProbe:
            httpGet:
              path: /v1/info
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /v1/info
              port: http
            initialDelaySeconds: 60
            periodSeconds: 20
            failureThreshold: 6
          volumeMounts:
            - name: coordinator-config
              mountPath: /etc/trino/config.properties
              subPath: config.properties
              readOnly: true
            - name: coordinator-config
              mountPath: /etc/trino/access-control.properties
              subPath: access-control.properties
              readOnly: true
            - name: coordinator-config
              mountPath: /etc/trino/access-control-rules.json
              subPath: access-control-rules.json
              readOnly: true
            - name: coordinator-config
              mountPath: /etc/trino/password-authenticator.properties
              subPath: password-authenticator.properties
              readOnly: true
            # Certificate + private key in one PEM, and the bcrypt password file.
            # Both generated by Terraform into the trino-auth Secret.
            - name: tls
              mountPath: /etc/trino/tls
              readOnly: true
            - name: auth
              mountPath: /etc/trino/auth
              readOnly: true
            - name: node-config
              mountPath: /etc/trino/node.properties
              subPath: node.properties
              readOnly: true
            - name: catalog
              mountPath: /etc/trino/catalog
              readOnly: true
            - name: data
              mountPath: /data/trino
      volumes:
        - name: coordinator-config
          configMap:
            name: trino-coordinator-config
        - name: node-config
          configMap:
            name: trino-node-config
        - name: catalog
          configMap:
            name: trino-catalog
        # Both from the trino-auth Secret created by Terraform. Mode 0400 because
        # the private key and the bcrypt hashes should not be world-readable inside
        # the container.
        - name: tls
          secret:
            secretName: trino-auth
            defaultMode: 0400
            items:
              - key: tls.pem
                path: tls.pem
        - name: auth
          secret:
            secretName: trino-auth
            defaultMode: 0400
            items:
              - key: password.db
                path: password.db
        # Holds the generated node.id and local logs. Ephemeral on purpose:
        # Trino keeps no durable state here.
        - name: data
          emptyDir: {}
