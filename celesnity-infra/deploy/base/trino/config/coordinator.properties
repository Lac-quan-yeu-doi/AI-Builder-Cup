## Trino coordinator — CLOUD deployments only.
##
## This file diverges deliberately from config/trino/coordinator.properties, which
## the local Compose stack uses. Local dev stays unauthenticated over plain HTTP;
## every cloud deployment requires a password over TLS. Pretending those two are
## the same configuration would mean either breaking local dev with self-signed
## certificates or shipping an unauthenticated SQL engine to a cloud.
##
## The planning and memory settings below are duplicated from the shared file. That
## duplication is the cost of the split; keep them in step when tuning.

coordinator=true
node-scheduler.include-coordinator=false
discovery.uri=http://trino-coordinator:8080

## Two listeners, on purpose.
##
## 8080 (HTTP) carries only coordinator/worker discovery and internal RPC, which is
## authenticated by internal-communication.shared-secret rather than by password.
## Client requests to authenticated endpoints over HTTP are refused.
##
## 8443 (HTTPS) is the client-facing listener where PASSWORD authentication applies.
http-server.http.port=8080
http-server.https.enabled=true
http-server.https.port=8443

## PEM keystore: a single file containing the certificate followed by its private
## key. Trino accepts PEM directly, so there is no JKS/PKCS12 conversion and no
## keystore password to manage. Generated by Terraform and mounted from a Secret.
http-server.https.keystore.path=/etc/trino/tls/tls.pem

## File-based password authentication, configured in
## password-authenticator.properties.
http-server.authentication.type=PASSWORD

## REQUIRED when a load balancer sits in front. Both clouds put one there: a GKE
## Ingress on GCP, an ALB on AWS. The load balancer appends X-Forwarded-For and
## X-Forwarded-Proto, and Trino REFUSES the request outright rather than ignoring
## the headers:
##
##   406 "Server configuration does not allow processing of the
##        X-Forwarded-For header"
##
## Every request through the load balancer fails with that, while the same request
## over a port-forward succeeds, so it looks like a load balancer fault rather than
## a Trino setting.
##
## Safe here because the coordinator Service is ClusterIP: the only routes to 8443
## are the load balancer and in-cluster clients. Do not enable this on a
## coordinator that is directly reachable, since a client could then spoof its
## apparent source address in the query log.
http-server.process-forwarded=true

## REQUIRED once authentication is enabled. Coordinator and workers must carry the
## same value or workers cannot register, and the failure looks like workers simply
## never appearing rather than an auth error.
internal-communication.shared-secret=${ENV:TRINO_SHARED_SECRET}

## Cluster-wide and per-node query memory ceilings. Must match the worker file.
query.max-memory=${ENV:TRINO_QUERY_MAX_MEMORY}
query.max-memory-per-node=${ENV:TRINO_QUERY_MAX_MEMORY_PER_NODE}
