## Trino worker — CLOUD deployments only.
##
## Diverges from config/trino/worker.properties only by the shared secret. See the
## coordinator file in this directory for why the cloud and local configurations
## are separate.

coordinator=false
http-server.http.port=8080
discovery.uri=http://trino-coordinator:8080

## Must be byte-identical to the coordinator's value. A mismatch does not produce
## an authentication error — the worker just never registers, and the cluster looks
## like it has no capacity.
internal-communication.shared-secret=${ENV:TRINO_SHARED_SECRET}

## Must match the coordinator so memory accounting agrees cluster-wide.
query.max-memory=${ENV:TRINO_QUERY_MAX_MEMORY}
query.max-memory-per-node=${ENV:TRINO_QUERY_MAX_MEMORY_PER_NODE}
