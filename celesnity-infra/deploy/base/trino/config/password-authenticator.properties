## File-based password authentication.
##
## Chosen over OAuth2/OIDC or mTLS because it has no external dependency: no
## identity provider to stand up, and it works with the Trino CLI, JDBC, and the
## web UI unchanged. The tradeoff is that credentials are managed here rather than
## centrally, so it does not scale past a small team and offers no SSO or MFA.
##
## Move to OAuth2 against your identity provider before this has real users.
password-authenticator.name=file

## htpasswd-format file of user:bcrypt-hash pairs, generated by Terraform and
## mounted from a Secret. Trino requires bcrypt with a minimum cost of 8;
## Terraform's bcrypt() uses cost 10.
file.password-file=/etc/trino/auth/password.db

## Re-read interval. Rotating the password means updating the Secret and waiting
## this long, with no restart.
file.refresh-period=1m

## Cap concurrent bcrypt verifications. Each is deliberately expensive, so an
## unbounded pool lets a burst of failed logins consume the coordinator's CPU.
file.auth-token-cache.max-size=1000
