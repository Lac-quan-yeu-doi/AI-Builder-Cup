---
# Shared external Gateway. PLATFORM-OWNED.
#
# One Gateway is one Application Load Balancer, holding one address and one
# certificate. Services do NOT edit this file: each attaches its own HTTPRoute,
# declaring its own hostname and backend. That is the whole reason for using
# Gateway API here rather than more Ingress objects — on GKE every Ingress
# provisions a separate load balancer with a separate IP, and there is no
# equivalent of the AWS ALB group.name annotation to merge them.
#
# Requires enable_external_lb = true in infra/environments/gcp-prod. Terraform
# reserves the address and wraps the operator-created Certificate Manager
# certificate in the map referenced below.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: celesnity
  annotations:
    # Certificate Manager map holding the real certificate, created by Terraform as
    # "${local.name}-trino-lb" and wrapping the certificate named by
    # lb_certificate_name. Keep in step with infra/environments/gcp-prod.
    #
    # MUTUALLY EXCLUSIVE with the listener's certificateRefs. Set both and the
    # Gateway never programs. Set this to an empty string and it also never
    # programs, because the controller builds a reference ending in "/" and the API
    # rejects it as "not a valid reference" — so remove the annotation entirely
    # rather than blanking it if you go back to a Secret.
    networking.gke.io/certmap: celesnity-gcp-prod-trino-lb
spec:
  # Global external ALB, on an anycast address advertised from every region.
  #
  # Chosen over gke-l7-regional-external-managed because the regional class
  # requires a REGIONAL_MANAGED_PROXY subnet in every region it runs in, which the
  # network module does not create. The global class needs no proxy-only subnet.
  # gke-l7-rilb would be the internal equivalent, and gke-l7-gxlb the older
  # classic load balancer.
  gatewayClassName: gke-l7-global-external-managed

  # The address reserved by Terraform. NamedAddress refers to it by resource name
  # rather than by literal IP, so the two never drift. Reserved rather than
  # ephemeral because production DNS points at it and it must survive Gateway
  # reconciliation or replacement.
  addresses:
    - type: NamedAddress
      value: celesnity-gcp-prod-trino-lb

  listeners:
    # HTTPS only. There is deliberately NO port 80 listener: Trino sends
    # credentials in an Authorization header, so a plaintext listener would put
    # the password on the wire. Under Ingress this took an explicit
    # allow-http: "false" annotation; here it is simply the absence of a listener.
    - name: https
      protocol: HTTPS
      port: 443

      # NO tls block. The certificate comes from the certmap annotation above, and
      # a certificateRefs list here would conflict with it.
      #
      # TLS is still terminated at the load balancer and re-encrypted to the pod,
      # because the Service declares appProtocol: HTTPS and Trino only accepts
      # authenticated requests on its TLS port.
      #
      # To fall back to a self-signed Secret: delete the certmap annotation, unset
      # lb_certificate_name so Terraform recreates the Secret, and restore
      #   tls:
      #     mode: Terminate
      #     certificateRefs:
      #       - name: trino-lb-tls

      # Cross-namespace attachment, restricted by label rather than open to All.
      #
      # "All" would let any namespace in the cluster publish itself on the
      # internet through this load balancer just by creating an HTTPRoute. The
      # selector means a namespace has to be deliberately marked; Terraform sets
      # the label on the workload namespace it creates.
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              celesnity.io/gateway-access: "true"
        kinds:
          - group: gateway.networking.k8s.io
            kind: HTTPRoute
