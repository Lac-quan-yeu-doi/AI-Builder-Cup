apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: celesnity-application-release-deployer
rules:
  # Core owns a worker Role with these exact permissions. Holding the same
  # permissions lets the release account reconcile that Role without the
  # project-wide container.roles.escalate permission.
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "get", "list", "watch", "delete"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["configmaps", "secrets"]
    verbs: ["create", "get", "delete"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["roles", "rolebindings"]
    verbs: ["create", "get", "list", "watch", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: celesnity-application-release-deployer
subjects:
  - kind: User
    name: celesnity-apps-cloud-build@celesnity-minder-platform.iam.gserviceaccount.com
    apiGroup: rbac.authorization.k8s.io
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: celesnity-application-release-deployer
