apiVersion: apps/v1
kind: Deployment
metadata:
  name: mqtt-bronze-stream-shared-0
spec:
  template:
    spec:
      containers:
        - name: driver
          env:
            - name: STREAMING_TRIGGER_INTERVAL
              # Avoid producing one tiny Iceberg file and snapshot for each
              # sparse telemetry event. Thirty seconds still keeps the dev UI
              # responsive while giving each micro-batch time to accumulate.
              value: 30 seconds
            # Development topics may be recreated while their durable Spark
            # checkpoint still refers to offsets from the previous topic. Skip
            # only those unavailable offsets and resume from retained records.
            # Production keeps the script's strict default (true).
            - name: REDPANDA_FAIL_ON_DATA_LOSS
              value: "false"
