# Iceberg catalog for GCP.
#
# The only Trino config file that genuinely differs between environments.
# Everything else is shared from config/trino/. Compare with the other targets:
#
#   local    - MinIO at http://minio:9000, path-style access, static root keys
#   gcp-dev  - real GCS, credentials via Workload Identity Federation for GKE
#   gcp-prod - separate production GCS buckets through the same identity model
connector.name=iceberg
iceberg.catalog.type=jdbc
iceberg.jdbc-catalog.catalog-name=celesnity
iceberg.jdbc-catalog.driver-class=org.postgresql.Driver

# sslmode=require is not optional. The Cloud SQL instance is created with
# ssl_mode = ENCRYPTED_ONLY, so an unencrypted connection is refused outright.
# RDS accepts plaintext by default, which is why the AWS variant omits this.
iceberg.jdbc-catalog.connection-url=jdbc:postgresql://${ENV:POSTGRES_HOST}:${ENV:POSTGRES_PORT}/${ENV:POSTGRES_DB}?sslmode=require
iceberg.jdbc-catalog.connection-user=${ENV:POSTGRES_USER}
iceberg.jdbc-catalog.connection-password=${ENV:POSTGRES_PASSWORD}
iceberg.jdbc-catalog.default-warehouse-dir=${ENV:WAREHOUSE_S3_PATH}
iceberg.jdbc-catalog.schema-version=V1

# Native GCS filesystem. Note the property is fs.gcs.enabled, not
# fs.native-gcs.enabled — the legacy hive.gcs.* support was removed in Trino 483.
fs.gcs.enabled=true
gcs.project-id=${ENV:GCP_PROJECT_ID}

# APPLICATION_DEFAULT is required, not optional, and it is the only value that
# works with Workload Identity.
#
# The default is SERVICE_ACCOUNT, which the Trino documentation describes as
# loading credentials from the environment with gcs.json-key being an optional
# override. In Trino 483 that is not what happens: a config validation
# (GcsServiceAccountAuthConfig.authMethodValid) rejects the catalog outright with
#
#   Either gcs.json-key or gcs.json-key-file-path must be set
#
# and the coordinator refuses to start. Supplying a key would mean creating and
# mounting a service account key file, which is exactly what Workload Identity
# exists to avoid.
#
# APPLICATION_DEFAULT resolves through the GKE metadata server, which is how the
# celesnity ServiceAccount reaches its Google service account.
#
# The caveat worth knowing: if ADC is ever unavailable, this does NOT fail loudly.
# Trino falls back to NoCredentials and attempts unauthenticated GCS access, so a
# broken Workload Identity binding surfaces as a 403 from GCS rather than a clear
# credential error. If you see unauthenticated access denials, verify the
# iam.gke.io/gcp-service-account annotation and the workloadIdentityUser binding
# before suspecting bucket permissions.
gcs.auth-type=APPLICATION_DEFAULT
