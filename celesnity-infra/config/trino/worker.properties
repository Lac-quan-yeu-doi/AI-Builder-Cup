## Trino worker.
## Workers register with the coordinator through the discovery URI and execute
## the splits assigned to them. This file is shared by every replica of the
## trino-worker service; node identity is generated per container into
## node.data-dir, so no per-replica configuration is required.
coordinator=false
http-server.http.port=8080
discovery.uri=http://trino-coordinator:8080

## Must match the coordinator so memory accounting agrees across the cluster.
query.max-memory=${ENV:TRINO_QUERY_MAX_MEMORY}
query.max-memory-per-node=${ENV:TRINO_QUERY_MAX_MEMORY_PER_NODE}
