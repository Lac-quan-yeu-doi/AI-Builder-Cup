## Trino coordinator.
## The coordinator plans queries and serves the HTTP API and UI. It also runs
## splits, so a single node works on a small host (trino-worker replicas: 0).
## Add workers with TRINO_WORKER_REPLICAS when there is RAM for them.
coordinator=true
node-scheduler.include-coordinator=true
http-server.http.port=8080
discovery.uri=http://trino-coordinator:8080

## Cluster-wide and per-node query memory ceilings.
## query.max-memory is the aggregate budget across workers, so it should scale
## with TRINO_WORKER_REPLICAS. query.max-memory-per-node must stay below
## (JVM heap - memory.heap-headroom-per-node); the container jvm.config sets the
## heap to 80% of the container memory limit.
query.max-memory=${ENV:TRINO_QUERY_MAX_MEMORY}
query.max-memory-per-node=${ENV:TRINO_QUERY_MAX_MEMORY_PER_NODE}
