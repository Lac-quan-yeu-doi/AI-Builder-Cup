## Trino system access control.
## Keep query users read-only while allowing the Core service user to create
## namespaces in the managed Iceberg catalog. The JSON policy deliberately
## grants Iceberg catalog access plus schema ownership only to the Core identity,
## while explicit table rules keep table creation and data writes denied.
access-control.name=file
security.config-file=/etc/trino/access-control-rules.json
