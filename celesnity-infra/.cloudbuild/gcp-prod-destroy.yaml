# Manual-only teardown for the disposable gcp-prod environment.
#
# This file is intentionally not attached to a branch or tag trigger. Submit it
# explicitly and provide the exact confirmation value below. Terraform state,
# operator-owned Certificate Manager certificates, Cloudflare DNS, and
# out-of-band runtime secrets are not part of the destroy state.

steps:
  - name: hashicorp/terraform:1.15.8
    id: destroy-gcp-prod
    entrypoint: sh
    args:
      - -ceu
      - |
        if [ "${_CONFIRM_DESTROY}" != "destroy-celesnity-gcp-prod" ]; then
          echo "ERROR: set _CONFIRM_DESTROY=destroy-celesnity-gcp-prod"
          exit 1
        fi

        TF_DIR="infra/environments/gcp-prod"
        VAR_FILE="terraform.tfvars.example"

        terraform -chdir="$$TF_DIR" init -input=false \
          -backend-config="bucket=${_STATE_BUCKET}" \
          -backend-config="prefix=celesnity-infra/gcp-prod"

        terraform -chdir="$$TF_DIR" validate

        # Deletion protection is enforced by both GKE and Cloud SQL. The bucket
        # force_destroy flag also has to be written to state before a destroy
        # plan; passing the variable only to `plan -destroy` is not sufficient.
        set --
        if terraform -chdir="$$TF_DIR" state list \
          | grep -q '^module.cluster.google_container_cluster.this$$'; then
          set -- "$$@" -target=module.cluster.google_container_cluster.this
        fi
        if terraform -chdir="$$TF_DIR" state list \
          | grep -q '^module.data.google_sql_database_instance.this$$'; then
          set -- "$$@" -target=module.data.google_sql_database_instance.this
        fi
        if terraform -chdir="$$TF_DIR" state list \
          | grep -q '^module.data.google_storage_bucket.this'; then
          set -- "$$@" -target=module.data.google_storage_bucket.this
        fi

        if [ "$$#" -gt 0 ]; then
          terraform -chdir="$$TF_DIR" apply -input=false -auto-approve \
            -lock-timeout=10m \
            -var-file="$$VAR_FILE" \
            -var='cluster_deletion_protection=false' \
            -var='db_deletion_protection=false' \
            -var='force_destroy_buckets=true' \
            "$$@"
        fi

        # The database and SQL user cannot outlive their Cloud SQL instance.
        # Forget the child resources so instance deletion performs the cascade;
        # otherwise Terraform deletes them in parallel and PostgreSQL can reject
        # the user drop while that user still owns objects in the database.
        for child_address in \
          module.data.google_sql_database.this \
          module.data.google_sql_user.this
        do
          if terraform -chdir="$$TF_DIR" state list | grep -qx "$$child_address"; then
            terraform -chdir="$$TF_DIR" state rm "$$child_address"
          fi
        done

        # A partial destroy can remove the cluster before Terraform has removed
        # every Kubernetes/Helm address from state. Those objects cannot still
        # exist once the cluster is gone, and refreshing them would fail because
        # there is no Kubernetes API endpoint. Prune only those cluster-bound
        # state entries before resuming the cloud-resource destroy.
        if ! terraform -chdir="$$TF_DIR" state list \
          | grep -q '^module.cluster.google_container_cluster.this$$'; then
          terraform -chdir="$$TF_DIR" state list \
            | grep -E '\.(helm_release|kubernetes_[^.]+)\.' \
            | while IFS= read -r cluster_address; do
                terraform -chdir="$$TF_DIR" state rm "$$cluster_address"
              done
        fi

        terraform -chdir="$$TF_DIR" plan -destroy -input=false \
          -lock-timeout=10m \
          -var-file="$$VAR_FILE" \
          -var='cluster_deletion_protection=false' \
          -var='db_deletion_protection=false' \
          -var='force_destroy_buckets=true' \
          -var='install_observability=false' \
          -out=/workspace/gcp-prod-destroy.tfplan

        terraform -chdir="$$TF_DIR" apply -input=false -auto-approve \
          -lock-timeout=10m /workspace/gcp-prod-destroy.tfplan

substitutions:
  _CONFIRM_DESTROY: not-confirmed
  _STATE_BUCKET: celesnity-gcp-prod-tfstate-celesnity-minder-platform

options:
  logging: CLOUD_LOGGING_ONLY

timeout: 7200s
