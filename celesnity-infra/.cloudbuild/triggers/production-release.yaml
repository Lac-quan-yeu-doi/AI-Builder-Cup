name: celesnity-infra-production-release
description: >-
  Apply Celesnity production infrastructure for semantic-version release tags
  created from the approved release/0.1.0 branch.
repositoryEventConfig:
  repository: projects/celesnity-minder-platform/locations/europe-west2/connections/celesnity/repositories/celesnity-celesnity-infra
  repositoryType: GITHUB
  push:
    tag: ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$
filename: cloudbuild.yaml
serviceAccount: projects/celesnity-minder-platform/serviceAccounts/celesnity-infra-cloud-build@celesnity-minder-platform.iam.gserviceaccount.com
approvalConfig:
  approvalRequired: true
includeBuildLogs: INCLUDE_BUILD_LOGS_WITH_STATUS
substitutions:
  _ACTION: apply
  _CONFIRM_TARGET: celesnity-gcp-prod
  _REQUIRE_RELEASE_TAG: "true"
  _ENV: gcp-prod
  _REGION: europe-west2
  _CLUSTER: celesnity-gcp-prod
  _CLUSTER_LOCATION_TYPE: region
  _CLUSTER_LOCATION: europe-west2
  _NAMESPACE: celesnity-prod
  _STATE_BUCKET: celesnity-gcp-prod-tfstate-celesnity-minder-platform
  _SPARK_REPOSITORY: europe-west2-docker.pkg.dev/celesnity-minder-platform/celesnity-gcp-prod-spark/spark
