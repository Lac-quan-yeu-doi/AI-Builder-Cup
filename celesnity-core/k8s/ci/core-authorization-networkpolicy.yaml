apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: core-authorization-jobs-egress
  namespace: __NAMESPACE__
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: celesnity-core
      app.kubernetes.io/component: authorization-job
  policyTypes: [Egress]
  egress:
    - ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
    - to:
        - ipBlock: { cidr: 10.0.0.0/8 }
        - ipBlock: { cidr: 172.16.0.0/12 }
        - ipBlock: { cidr: 192.168.0.0/16 }
      ports:
        - { protocol: TCP, port: 5432 }
