apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  # AgentWebhookClient (automation dispatch -> minder-runtime) calls
  # POST /webhooks/{source} on minder-serve. common/networking's egress
  # allow-list has no rule for it, so this used to time out even with
  # MINDER_AGENT_URL configured correctly.
  name: celesnity-core-api-egress-to-minder-serve
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: celesnity-core
      app.kubernetes.io/component: api
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: minder
          podSelector:
            matchLabels:
              app.kubernetes.io/name: minder-serve
      ports:
        - protocol: TCP
          port: 8080
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  # Scheduled (non-test-fire) automation dispatch runs from the worker's
  # AGENT_AUTOMATION_SCHEDULE poll, same reachability requirement as api.
  name: celesnity-core-worker-egress-to-minder-serve
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: celesnity-core
      app.kubernetes.io/component: worker
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: minder
          podSelector:
            matchLabels:
              app.kubernetes.io/name: minder-serve
      ports:
        - protocol: TCP
          port: 8080
