apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: celesnity-core
spec:
  parentRefs:
    - name: celesnity
      sectionName: https
  hostnames:
    - api-dev.celesnity.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: celesnity-core
          port: 3001
