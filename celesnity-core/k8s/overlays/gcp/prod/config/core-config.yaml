apiVersion: v1
kind: ConfigMap
metadata:
  name: celesnity-core-config
data:
  # Application
  NODE_ENV: "production"
  CELESNITY_AUTH_MODE: "identity-platform"
  PORT: "3001"
  API_BIND_ADDRESS: "0.0.0.0"
  WEB_ORIGIN: "https://app.celesnity.com"
  IDENTITY_PLATFORM_PROJECT_ID: "celesnity-minder-platform"
  DEFAULT_ORGANIZATION_ID: "00000000-0000-4000-8000-000000000001"
  AGENT_SERVICE_AUDIENCE: "http://celesnity-core.celesnity-prod.svc.cluster.local:3001"
  AGENT_SERVICE_ACCOUNT_EMAIL: "celesnity-gcp-prod-agent@celesnity-minder-platform.iam.gserviceaccount.com"
  MINDER_AGENT_URL: "http://minder-serve.minder-prod.svc.cluster.local:8080/api/v2"
  MINDER_ASSERTION_KEY_ID: "celesnity-prod-assertion-v1"
  MINDER_ASSERTION_TTL_SECONDS: "60"
  FIRMWARE_SIGNING_PROVIDER: "GCP_KMS"
  FIRMWARE_SIGNING_KEY_ID: "celesnity-prod-ed25519-v1"
  FIRMWARE_SIGNING_KMS_KEY_VERSION: "projects/celesnity-minder-platform/locations/europe-west2/keyRings/celesnity-gcp-prod-firmware/cryptoKeys/celesnity-gcp-prod-firmware-signing/cryptoKeyVersions/1"
  GOOGLE_OAUTH_CLIENT_ID: "496692276740-m37rt32fn1j86be0fiep3au0lm92mu3k.apps.googleusercontent.com"

  # Object storage and credential encryption
  MINIO_ENDPOINT: "https://storage.googleapis.com"
  FIRMWARE_ARTIFACT_STORAGE_PROVIDER: "GCS"
  FIRMWARE_DOWNLOAD_URL_TTL_SECONDS: "900"
  SCRIPT_SOURCE_MAX_BYTES: "700000"
  CONNECTION_CREDENTIAL_ACTIVE_KEY_VERSION: "v1"

  # Trino and query limits
  TRINO_URL: "https://trino-coordinator:8443"
  TRINO_USER: "celesnity"
  TRINO_CATALOG: "iceberg"
  CATALOG_PREVIEW_MAX_ROWS: "100"
  SQL_QUERY_TIMEOUT_MS: "60000"
  SQL_MAX_RESULT_ROWS: "1000"
  CHART_QUERY_TIMEOUT_MS: "60000"
  CHART_PREVIEW_MAX_ROWS: "1000"
  CHART_RUN_MAX_ROWS: "10000"
  CHART_PREVIEW_MAX_BYTES: "10485760"
  CHART_RUN_MAX_BYTES: "10485760"

  # Spark execution
  SPARK_EXECUTION_BACKEND: 'kubernetes'
  SPARK_MASTER_URL: 'spark://spark-master:7077'
  SPARK_SUBMIT_MASTER_URL: 'spark://spark-master:7077'
  SPARK_SUBMIT_BIN: '/opt/spark/bin/spark-submit'
  SPARK_CONTAINER: 'spark-master'
  KUBERNETES_NAMESPACE: 'celesnity-prod'
  SPARK_EXECUTION_IMAGE: 'europe-west2-docker.pkg.dev/celesnity-minder-platform/celesnity-gcp-prod-spark/spark@sha256:6d75cbb8a5763ac6e1a3d41345ec54014585ac81d0b95594a8b8bdbad3c285ff'
  SPARK_JOB_SERVICE_ACCOUNT: 'celesnity-spark-job'
  SPARK_KUBERNETES_POLL_INTERVAL_MS: '1000'
  SPARK_JOB_TTL_SECONDS: '3600'
  SPARK_DRIVER_MEMORY: '1g'
  SPARK_EXECUTOR_MEMORY: '1g'
  SPARK_EXECUTOR_CORES: '1'
  SPARK_MAX_CORES: '2'
  EXECUTION_TIMEOUT_MS: '900000'
  EXECUTION_POLL_INTERVAL_MS: '1000'
  EXECUTION_CLAIM_BATCH_SIZE: '1'
  EXECUTION_MAX_ATTEMPTS: '3'

  # Outbound connection checks
  CONNECTION_ALLOW_PRIVATE_DESTINATIONS: 'false'
  CONNECTION_ALLOWED_HOSTS: ''
  CONNECTION_TEST_TIMEOUT_MS: '5000'

  # Outbox relay
  OUTBOX_RELAY_POLL_INTERVAL_MS: '1000'
  OUTBOX_RELAY_BATCH_SIZE: '100'
  OUTBOX_RELAY_MAX_ATTEMPTS: '10'
  OUTBOX_RELAY_BASE_BACKOFF_MS: '1000'
  OUTBOX_RELAY_MAX_BACKOFF_MS: '300000'
  OUTBOX_RELAY_CLAIM_TIMEOUT_MS: '300000'
  OUTBOX_RELAY_MAINTENANCE_INTERVAL_MS: '60000'
  OUTBOX_RELAY_MAX_CONSECUTIVE_DRAINS: '10'
  OUTBOX_RETENTION_MS: '604800000'

  # Streaming and integration events
  REDPANDA_TLS_ENABLED: "true"
  REDPANDA_CONTROL_TOPIC: "celesnity.streaming.control.v1"
  INTEGRATION_EVENT_PUBLISHER_BACKEND: "redpanda"
  STREAMING_RECONCILE_INTERVAL_MS: "2000"
  STREAMING_RECONCILE_BATCH_SIZE: "20"
  DEVICE_EXPECTED_CHECK_IN_INTERVAL_SECONDS: "60"
  DEVICE_MISSED_CHECK_IN_THRESHOLD: "3"
  DEVICE_CONTACT_MONITOR_INTERVAL_MS: "5000"
  DEVICE_CONTACT_MONITOR_BATCH_SIZE: "100"
  DEVICE_CONFIGURATION_CONFIRMATION_TIMEOUT_SECONDS: "300"
  DEVICE_CONFIGURATION_MONITOR_INTERVAL_MS: "5000"
  DEVICE_CONFIGURATION_MONITOR_BATCH_SIZE: "100"
  FIRMWARE_BOOT_CONFIRMATION_TIMEOUT_SECONDS: "300"
  FIRMWARE_CONFIRMATION_MONITOR_INTERVAL_MS: "5000"
  FIRMWARE_CONFIRMATION_MONITOR_BATCH_SIZE: "100"
