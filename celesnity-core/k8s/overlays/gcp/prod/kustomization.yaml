apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: celesnity-prod

resources:
  - ../common
  - config/core-config.yaml
  - secrets/core-runtime-secret.template.yaml
  - scaling/api-hpa.yaml
  - policy/api-pdb.yaml
  - networking/agent-api-network-policy.yaml
  - routing/api-backend-policy.yaml
  - routing/api-http-route.yaml

images:
  - name: celesnity/core
    newName: europe-west2-docker.pkg.dev/celesnity-minder-platform/celesnity-gcp-prod-apps/core
    newTag: production-release-required

replicas:
  - name: celesnity-core-worker
    count: 1
