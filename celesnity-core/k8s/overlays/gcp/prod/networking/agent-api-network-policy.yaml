apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: celesnity-core-api-from-agent
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: celesnity-core
      app.kubernetes.io/component: api
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: minder-prod
          podSelector:
            matchLabels:
              # Runtime and versioned migration Jobs use the same verified
              # Agent workload identity; admit only their marked Core clients.
              celesnity.io/core-client: 'true'
      ports:
        - protocol: TCP
          port: 3001
