apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../../base
  - networking/api-network-policy.yaml
  - networking/worker-network-policy.yaml
  - monitoring/api-pod-monitoring.yaml
  - health/api-healthcheck-policy.yaml

patches:
  - path: availability/api-topology-spread-patch.yaml
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: celesnity-core
    path: database/api-postgres-tls-patch.yaml
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: celesnity-core-worker
    path: database/worker-postgres-tls-patch.yaml
