apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: celesnity-core-worker-deny-ingress
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: celesnity-core
      app.kubernetes.io/component: worker
  policyTypes:
    - Ingress
    - Egress
  egress:
    # GKE Dataplane V2 evaluates kube-dns Service traffic in a way that does not
    # reliably match the kube-system pod selector. Restrict DNS by port instead;
    # the resolver address still comes from the pod's managed resolv.conf.
    - ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
    - ports:
        - { protocol: TCP, port: 443 }
        - { protocol: TCP, port: 5432 }
        - { protocol: TCP, port: 8443 }
        - { protocol: TCP, port: 18083 }
    # Capacity admission reads the Spark master's internal JSON status endpoint
    # before creating a driver Job.
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: spark
              app.kubernetes.io/component: master
      ports:
        - { protocol: TCP, port: 8080 }
    # Outbox and crawler events use the TLS Kafka listener in the dedicated
    # streaming namespace.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: celesnity-streaming
          podSelector:
            matchLabels:
              app.kubernetes.io/name: redpanda
              app.kubernetes.io/instance: redpanda
      ports:
        - { protocol: TCP, port: 9093 }
    - to:
        - ipBlock: { cidr: 169.254.169.254/32 }
      ports:
        - { protocol: TCP, port: 80 }
        - { protocol: TCP, port: 8080 }
