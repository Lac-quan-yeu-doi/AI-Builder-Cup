apiVersion: apps/v1
kind: Deployment
metadata:
  name: celesnity-core
  labels:
    app.kubernetes.io/name: celesnity-core
    app.kubernetes.io/component: api
spec:
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  progressDeadlineSeconds: 420
  selector:
    matchLabels:
      app.kubernetes.io/name: celesnity-core
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: celesnity-core
        app.kubernetes.io/component: api
    spec:
      serviceAccountName: celesnity-core-api
      automountServiceAccountToken: true
      terminationGracePeriodSeconds: 90
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: celesnity/core
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3001
              protocol: TCP
          env:
            - name: POSTGRES_HOST
              valueFrom:
                secretKeyRef:
                  name: celesnity-database
                  key: POSTGRES_HOST
            - name: POSTGRES_PORT
              valueFrom:
                secretKeyRef:
                  name: celesnity-database
                  key: POSTGRES_PORT
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: celesnity-database
                  key: POSTGRES_DB
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: celesnity-database
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: celesnity-database
                  key: POSTGRES_PASSWORD
            - name: DATABASE_URL
              value: postgresql://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@$(POSTGRES_HOST):$(POSTGRES_PORT)/$(POSTGRES_DB)?schema=celesnity_app
            - name: WAREHOUSE_BUCKET
              valueFrom:
                configMapKeyRef:
                  name: celesnity-storage
                  key: WAREHOUSE_BUCKET
            - name: ARTIFACTS_BUCKET
              valueFrom:
                configMapKeyRef:
                  name: celesnity-storage
                  key: ARTIFACTS_BUCKET
            - name: MINIO_WAREHOUSE_BUCKET
              value: $(WAREHOUSE_BUCKET)
            - name: MINIO_ARTIFACTS_BUCKET
              value: $(ARTIFACTS_BUCKET)
            - name: TRINO_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: trino-client
                  key: password
            - name: NODE_EXTRA_CA_CERTS
              value: /etc/trino/ca/ca.crt
          envFrom:
            - configMapRef:
                name: celesnity-core-config
            - secretRef:
                name: celesnity-core-secrets
            - secretRef:
                name: celesnity-streaming
          resources:
            requests:
              cpu: 150m
              memory: 384Mi
            limits:
              memory: 640Mi
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 24
          readinessProbe:
            httpGet:
              path: /api/v1/health/ready
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: trino-ca
              mountPath: /etc/trino/ca
              readOnly: true
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
        - name: trino-ca
          secret:
            secretName: trino-client
            items:
              - key: ca.crt
                path: ca.crt
            defaultMode: 0444
