apiVersion: apps/v1
kind: Deployment
metadata:
  name: celesnity-core-worker
  labels:
    app.kubernetes.io/name: celesnity-core
    app.kubernetes.io/component: worker
spec:
  replicas: 1
  strategy:
    type: Recreate
  progressDeadlineSeconds: 300
  selector:
    matchLabels:
      app.kubernetes.io/name: celesnity-core
      app.kubernetes.io/component: worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: celesnity-core
        app.kubernetes.io/component: worker
    spec:
      serviceAccountName: celesnity-core-worker
      automountServiceAccountToken: true
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: worker
          image: celesnity/core
          imagePullPolicy: IfNotPresent
          command: ["node", "dist/bootstrap/worker-main.js"]
          env:
            - name: POSTGRES_HOST
              valueFrom:
                secretKeyRef:
                  name: celesnity-database
                  key: POSTGRES_HOST
            - name: POSTGRES_PORT
              valueFrom:
                secretKeyRef:
                  name: celesnity-database
                  key: POSTGRES_PORT
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: celesnity-database
                  key: POSTGRES_DB
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: celesnity-database
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: celesnity-database
                  key: POSTGRES_PASSWORD
            - name: DATABASE_URL
              value: postgresql://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@$(POSTGRES_HOST):$(POSTGRES_PORT)/$(POSTGRES_DB)?schema=celesnity_app
            - name: WAREHOUSE_BUCKET
              valueFrom:
                configMapKeyRef:
                  name: celesnity-storage
                  key: WAREHOUSE_BUCKET
            - name: ARTIFACTS_BUCKET
              valueFrom:
                configMapKeyRef:
                  name: celesnity-storage
                  key: ARTIFACTS_BUCKET
            - name: MINIO_WAREHOUSE_BUCKET
              value: $(WAREHOUSE_BUCKET)
            - name: MINIO_ARTIFACTS_BUCKET
              value: $(ARTIFACTS_BUCKET)
            - name: TRINO_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: trino-client
                  key: password
            - name: NODE_EXTRA_CA_CERTS
              value: /etc/trino/ca/ca.crt
          envFrom:
            - configMapRef:
                name: celesnity-core-config
            - secretRef:
                name: celesnity-core-secrets
            - secretRef:
                name: celesnity-streaming
          resources:
            requests:
              cpu: 100m
              memory: 320Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            exec:
              command: ["sh", "-c", "test -f /tmp/celesnity-worker-ready"]
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 2
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: trino-ca
              mountPath: /etc/trino/ca
              readOnly: true
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
        - name: trino-ca
          secret:
            secretName: trino-client
            items:
              - key: ca.crt
                path: ca.crt
            defaultMode: 0444
