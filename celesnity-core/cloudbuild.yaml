########################################
# celesnity-core -> GKE (celesnity-gcp-dev)
#
# Triggered on push to the development branch. Builds two images, fills in the
# runtime Secret from Secret Manager, and applies k8s/overlays/gcp/dev.
#
# The cluster, namespace, ServiceAccount, database Secret, storage ConfigMap,
# Gateway, and Artifact Registry repository are all owned by celesnity-infra. This
# pipeline creates none of them; it fails fast if they are missing rather than
# half-creating a second copy.
#
# One-time setup, from celesnity-infra:
#   terraform -chdir=infra/environments/gcp-dev output -raw apps_cloud_build_setup
#   terraform -chdir=infra/environments/gcp-dev output -raw apps_runtime_secrets
########################################

steps:
  # ---------------------------------------------------------------------------
  # Both images in one step, so the second build reuses the first one's layers.
  #
  # The app image and the migration image share every expensive stage — npm ci,
  # prisma generate, nest build — and only diverge at the end. Splitting them
  # across two steps would run that work twice, since a step's own layer cache is
  # only warm for as long as the build is.
  #
  # No --platform. Cloud Build workers and the cluster's e2 nodes are both x86_64,
  # so the native build is already the right architecture. That is the opposite of
  # celesnity-infra's Spark image on AWS, which has to cross-build for Graviton.
  # ---------------------------------------------------------------------------
  - name: gcr.io/cloud-builders/docker
    id: build-and-push
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail

        # Two tags per image. The commit tag is what gets deployed, so a rollout is
        # always traceable to a commit and a rollback is a tag change rather than a
        # rebuild. The moving tag is for humans reading `gcloud artifacts docker
        # images list` and is never what a running pod references.
        #
        # SHORT_SHA is empty for a manually invoked build with no commit. Use the
        # build ID in that case rather than deploying the moving tag: with
        # imagePullPolicy=IfNotPresent a node may otherwise reuse an older image
        # cached under development-latest. Written to a file because each step runs
        # in a fresh container and only /workspace survives between them.
        TAG="${SHORT_SHA}"
        if [ -z "$$TAG" ]; then
          TAG="manual-${BUILD_ID}"
          echo "==> no SHORT_SHA; deploying unique manual tag $$TAG"
        fi
        printf '%s' "$$TAG" > /workspace/.image-tag

        CORE="${_AR_HOST}/${PROJECT_ID}/${_AR_REPO}/core"
        MIGRATE="${_AR_HOST}/${PROJECT_ID}/${_AR_REPO}/core-migrate"

        echo "==> building $$CORE:$$TAG"
        docker build --pull \
          --target runtime \
          --tag "$$CORE:$$TAG" \
          --tag "$$CORE:${_MOVING_TAG}" \
          -f Dockerfile .

        # Reuses the build stage cached above. Exists because the runtime image
        # installs production dependencies only, and the Prisma CLI is a
        # devDependency, so `migrate deploy` cannot run from the app image.
        echo "==> building $$MIGRATE:$$TAG"
        docker build \
          --target migrator \
          --tag "$$MIGRATE:$$TAG" \
          --tag "$$MIGRATE:${_MOVING_TAG}" \
          -f Dockerfile .

        for ref in "$$CORE:$$TAG" "$$CORE:${_MOVING_TAG}" "$$MIGRATE:$$TAG" "$$MIGRATE:${_MOVING_TAG}"; do
          echo "==> pushing $$ref"
          docker push "$$ref"
        done

  # ---------------------------------------------------------------------------
  # Fill in the environment's runtime Secret template from Secret Manager.
  #
  # The committed file carries __PLACEHOLDER__ markers, so nothing sensitive is in
  # git and the rendered Secret only ever exists in this build's workspace.
  #
  # Values are base64-encoded into `data` rather than written to `stringData`,
  # matching how the manifest is written. Nothing is echoed: the whole point is to
  # keep these out of the build log, which is readable by anyone with
  # logging.viewer.
  # ---------------------------------------------------------------------------
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    id: inject-secrets
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        OVERLAY_ENV="$$(printf '%s' '${_ENV}' | sed 's/^gcp-//')"
        cd "k8s/overlays/gcp/$$OVERLAY_ENV"

        SECRET_MANIFEST="secrets/core-runtime-secret.template.yaml"
        CONFIG_MANIFEST="config/core-config.yaml"
        if [ ! -f "$$SECRET_MANIFEST" ]; then
          echo "ERROR: Secret template is missing for overlay ${_ENV}"
          exit 1
        fi
        if [ ! -f "$$CONFIG_MANIFEST" ]; then
          echo "ERROR: Core ConfigMap is missing for overlay ${_ENV}"
          exit 1
        fi
        if grep -R -n 'local-development' .; then
          echo "ERROR: local-development authentication must never appear in a GKE overlay"
          exit 1
        fi
        if ! grep -q 'CELESNITY_AUTH_MODE: "identity-platform"' "$$CONFIG_MANIFEST"; then
          echo "ERROR: GKE Core must explicitly enforce identity-platform authentication"
          exit 1
        fi

        # placeholder|secret-manager-name, the environment prefix added below.
        MAPPINGS=(
          "CONNECTION_CREDENTIAL_KEYS|core-credential-keys"
          "GCS_HMAC_ACCESS_KEY|gcs-hmac-access-key"
          "GCS_HMAC_SECRET_KEY|gcs-hmac-secret-key"
          "AUDIT_HASH_KEY|audit-hash-key"
          "FTPS_DEMO_PASSWORD|ftps-demo-password"
          "FTPS_STATUS_PASSWORD|ftps-status-password"
          "MCP_SHARED_SECRET|mcp-shared-secret"
          "MINDER_ASSERTION_PRIVATE_KEY_PEM|minder-assertion-private-key"
          "FIRMWARE_SIGNING_PUBLIC_KEYS|firmware-signing-public-keys"
          "GOOGLE_OAUTH_CLIENT_SECRET|google-oauth-client-secret"
        )
        if grep -q 'FIRMWARE_SIGNING_PROVIDER: "LOCAL_ED25519"' "$$CONFIG_MANIFEST"; then
          MAPPINGS+=("FIRMWARE_SIGNING_PRIVATE_KEY|firmware-signing-private-key")
        fi

        for mapping in "$${MAPPINGS[@]}"; do
          placeholder="$${mapping%%|*}"
          secret="${_ENV}-$${mapping##*|}"

          if ! grep -q "__$${placeholder}__" "$$SECRET_MANIFEST"; then
            echo "ERROR: placeholder __$${placeholder}__ is not in $$SECRET_MANIFEST"
            exit 1
          fi

          # Fail rather than default to empty. An empty CONNECTION_CREDENTIAL_KEYS
          # would crash every pod at startup with a validation error that reads like
          # an application bug, and an empty HMAC key would surface much later as an
          # opaque 403 from GCS on the first upload.
          if ! encoded=$$(gcloud secrets versions access latest --secret="$$secret" 2>/dev/null | base64 -w 0); then
            echo "ERROR: cannot read Secret Manager secret '$$secret'."
            echo "       Create it with the apps_runtime_secrets output in celesnity-infra,"
            echo "       and check this build's service account has roles/secretmanager.secretAccessor."
            exit 1
          fi

          # Encode the raw bytes directly. Do not strip newlines: PEM values need
          # their internal line breaks for Node's PKCS#8 parser to recognize them.
          if [ -z "$$encoded" ]; then
            echo "ERROR: secret '$$secret' resolved to an empty value"
            exit 1
          fi

          # The replacement is base64, so it has no & or | to confuse sed, and the
          # value never reaches the log.
          sed -i "s|__$${placeholder}__|$$encoded|g" "$$SECRET_MANIFEST"
          echo "==> injected $$secret"
        done

        if grep -q '__[A-Z_]*__' "$$SECRET_MANIFEST"; then
          echo "ERROR: unreplaced placeholders remain in $$SECRET_MANIFEST:"
          grep -o '__[A-Z_]*__' "$$SECRET_MANIFEST"
          exit 1
        fi

        if grep -Eq '__[A-Z_]+__' \
          "$$CONFIG_MANIFEST" "$$SECRET_MANIFEST"; then
          echo "ERROR: unresolved runtime configuration placeholders remain"
          exit 1
        fi

  # ---------------------------------------------------------------------------
  # Apply and wait.
  # ---------------------------------------------------------------------------
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    id: deploy
    entrypoint: bash
    env:
      - USE_GKE_GCLOUD_AUTH_PLUGIN=True
    args:
      - -c
      - |
        set -euo pipefail
        TAG=$$(cat /workspace/.image-tag)

        # Development is zonal and production is regional. The trigger selects
        # the correct location flag; using the wrong one returns "cluster not
        # found", which otherwise reads like a permissions problem.
        LOCATION_FLAG="--${_CLUSTER_LOCATION_TYPE}"
        gcloud container clusters get-credentials "${_CLUSTER}" \
          "$$LOCATION_FLAG" "${_CLUSTER_LOCATION}" --project "${PROJECT_ID}"

        # Execution Jobs pull their image independently of the long-lived Spark
        # master and workers. Resolve the immutable digest Kubernetes pulled for
        # the environment's healthy Spark master. This keeps Core synchronized
        # after either a development commit or a production release rebuilds
        # Spark, without granting the Core build identity access to the separate
        # Spark Artifact Registry repository.
        OVERLAY_ENV="$$(printf '%s' '${_ENV}' | sed 's/^gcp-//')"
        CONFIG_MANIFEST="k8s/overlays/gcp/$$OVERLAY_ENV/config/core-config.yaml"
        # Parse the ConfigMap as YAML instead of matching its quote style.
        # Client-side dry-run does not contact or mutate the cluster and works
        # for single-quoted, double-quoted, and unquoted scalar values.
        SPARK_EXECUTION_IMAGE="$$(kubectl create --dry-run=client --validate=false \
          -f "$$CONFIG_MANIFEST" -o jsonpath='{.data.SPARK_EXECUTION_IMAGE}')"

        EXPECTED_SPARK_REPOSITORY="$$(printf '%s' "$$SPARK_EXECUTION_IMAGE" \
          | sed -E 's/(@sha256:[0-9a-f]+|:[^/:]+)$$//')"
        if [ -z "$$EXPECTED_SPARK_REPOSITORY" ]; then
          echo "ERROR: SPARK_EXECUTION_IMAGE does not declare an expected repository"
          exit 1
        fi

        # A Core and Infra build may briefly overlap. Wait for the Deployment's
        # desired revision, then choose only pods whose declared image matches
        # that revision. Old terminating pods must not supply the execution
        # digest for the new Core rollout.
        kubectl -n "${_NAMESPACE}" rollout status deployment/spark-master --timeout=600s
        DESIRED_SPARK_IMAGE="$$(kubectl -n "${_NAMESPACE}" get deployment spark-master \
          -o jsonpath='{.spec.template.spec.containers[0].image}')"
        RUNNING_SPARK_IMAGES="$$(kubectl -n "${_NAMESPACE}" get pods \
          -l 'app.kubernetes.io/name=spark,app.kubernetes.io/component=master' \
          -o jsonpath='{range .items[*]}{.spec.containers[0].image}{"\t"}{.status.containerStatuses[0].imageID}{"\n"}{end}' \
          | awk -v desired="$$DESIRED_SPARK_IMAGE" '$$1 == desired && $$2 != "" { print $$2 }' \
          | sort -u)"
        if [ "$$(printf '%s\n' "$$RUNNING_SPARK_IMAGES" | sed '/^$$/d' | wc -l | tr -d ' ')" != "1" ]; then
          echo "ERROR: expected exactly one pulled digest for the desired Spark master image"
          echo "       desired: $$DESIRED_SPARK_IMAGE"
          exit 1
        fi
        RUNNING_SPARK_IMAGE="$$RUNNING_SPARK_IMAGES"
        case "$$RUNNING_SPARK_IMAGE" in
          "$$EXPECTED_SPARK_REPOSITORY"@sha256:*) ;;
          *)
            echo "ERROR: Spark master digest is outside the configured environment repository"
            echo "       expected repository: $$EXPECTED_SPARK_REPOSITORY"
            echo "       running image:       $$RUNNING_SPARK_IMAGE"
            exit 1
            ;;
        esac

        sed -i \
          "s|^\([[:space:]]*SPARK_EXECUTION_IMAGE:[[:space:]]*\).*|\1\"$$RUNNING_SPARK_IMAGE\"|" \
          "$$CONFIG_MANIFEST"
        echo "==> pinned Spark execution image to the healthy master digest"

        # Preflight against what celesnity-infra owns. Without these the apply
        # partly succeeds and the failure surfaces minutes later as pods stuck in
        # CreateContainerConfigError, which is a much longer path to the same answer.
        echo "==> checking prerequisites from celesnity-infra"
        for attempt in $$(seq 1 30); do
          if kubectl get customresourcedefinition/podmonitorings.monitoring.googleapis.com >/dev/null 2>&1; then
            break
          fi
          if [ "$$attempt" -eq 1 ]; then
            echo "    waiting for the managed Prometheus PodMonitoring CRD"
          fi
          sleep 10
        done
        if ! kubectl get customresourcedefinition/podmonitorings.monitoring.googleapis.com >/dev/null 2>&1; then
          echo "ERROR: PodMonitoring CRD is missing; deploy celesnity-infra first."
          exit 1
        fi
        for check in \
          "namespace/${_NAMESPACE}" \
          "serviceaccount/celesnity-core-api" \
          "serviceaccount/celesnity-core-worker" \
          "secret/celesnity-database" \
          "secret/trino-client" \
          "secret/celesnity-streaming" \
          "configmap/celesnity-storage" \
          "gateway.gateway.networking.k8s.io/celesnity"; do
          kind="$${check%%/*}"
          name="$${check##*/}"
          ns_flag="-n ${_NAMESPACE}"
          if [ "$$kind" = "namespace" ]; then ns_flag=""; fi
          if ! kubectl get "$$kind" "$$name" $$ns_flag >/dev/null 2>&1; then
            echo "ERROR: $$kind/$$name is missing."
            echo "       It is created by Terraform in celesnity-infra."
            echo "       Run: make infra-apply CLOUD=gcp && make deploy CLOUD=gcp"
            exit 1
          fi
        done

        # Organization identifiers are approved per environment. Existing
        # organizations retain their active owners; a fresh/unowned organization
        # additionally requires an approved first-owner subject and email.
        bootstrap_secret_dir="$$(mktemp -d)"
        chmod 700 "$$bootstrap_secret_dir"
        trap 'rm -f "$$bootstrap_secret_dir"/*; rmdir "$$bootstrap_secret_dir"' EXIT
        for key in \
          BOOTSTRAP_ORGANIZATION_ID BOOTSTRAP_ORGANIZATION_SLUG \
          BOOTSTRAP_ORGANIZATION_NAME BOOTSTRAP_HOME_REGION \
          BOOTSTRAP_IDENTITY_TENANT_ID; do
          if [ "$$key" = BOOTSTRAP_IDENTITY_TENANT_ID ]; then
            # Reuse Infra's existing Identity Platform tenant secret. Do not
            # create an independently maintained copy for first-owner binding.
            secret="${_ENV}-identity-platform-tenant-id"
          else
            suffix="$$(printf '%s' "$$key" | tr '[:upper:]_' '[:lower:]-')"
            secret="${_ENV}-auth-$$suffix"
          fi
          if ! gcloud secrets versions access latest --secret="$$secret" > "$$bootstrap_secret_dir/$$key" 2>/dev/null; then
            echo "ERROR: required bootstrap identifier $$secret is missing. No Core rollout was applied."
            exit 1
          fi
          if [ ! -s "$$bootstrap_secret_dir/$$key" ]; then
            echo "ERROR: required bootstrap identifier $$secret is empty."
            exit 1
          fi
        done
        owner_versions=0
        for key in BOOTSTRAP_OWNER_SUBJECT BOOTSTRAP_OWNER_EMAIL; do
          suffix="$$(printf '%s' "$$key" | tr '[:upper:]_' '[:lower:]-')"
          secret="${_ENV}-auth-$$suffix"
          if gcloud secrets versions access latest --secret="$$secret" > "$$bootstrap_secret_dir/$$key" 2>/dev/null; then
            if [ ! -s "$$bootstrap_secret_dir/$$key" ]; then
              echo "ERROR: approved bootstrap identifier $$secret is empty."
              exit 1
            fi
            owner_versions=$$((owner_versions + 1))
          else
            rm -f "$$bootstrap_secret_dir/$$key"
          fi
        done
        if [ "$$owner_versions" -eq 1 ]; then
          echo "ERROR: first-owner subject and email must have versions together."
          exit 1
        fi
        kubectl -n "${_NAMESPACE}" create secret generic celesnity-auth-bootstrap \
          --from-file="$$bootstrap_secret_dir" --dry-run=client -o yaml | kubectl apply -f -

        MIGRATE_IMAGE="${_AR_HOST}/${PROJECT_ID}/${_AR_REPO}/core-migrate:$$TAG"
        sed -e "s|__NAMESPACE__|${_NAMESPACE}|g" \
          k8s/ci/core-authorization-networkpolicy.yaml | kubectl apply -f -
        # Validate populated tenants before any migration can change the schema
        # underneath the currently running API. Recheck after bootstrap as well.
        for phase in preflight migrate-bootstrap readiness; do
          job_name="core-$$phase-$$(printf '%s' '${BUILD_ID}' | cut -c1-8)"
          sed \
            -e "s|__JOB_NAME__|$$job_name|g" \
            -e "s|__NAMESPACE__|${_NAMESPACE}|g" \
            -e "s|__CORE_MIGRATE_IMAGE__|$$MIGRATE_IMAGE|g" \
            "k8s/ci/core-$$phase-job.yaml" | kubectl apply -f -
          if ! kubectl -n "${_NAMESPACE}" wait --for=condition=complete \
            "job/$$job_name" --timeout=600s; then
            kubectl -n "${_NAMESPACE}" logs "job/$$job_name" --all-containers=true || true
            echo "ERROR: Core $$phase job failed; API and worker were not rolled out."
            exit 1
          fi
        done

        echo "==> installing kustomize"
        curl -sS "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" \
          | bash -s -- "${_KUSTOMIZE_VERSION}"
        mv kustomize /usr/local/bin/

        OVERLAY_ENV="$$(printf '%s' '${_ENV}' | sed 's/^gcp-//')"
        cd "k8s/overlays/gcp/$$OVERLAY_ENV"

        # Pin both images to the commit tag. The overlay commits a moving tag so the
        # manifests render meaningfully outside CI, but a Deployment referencing a
        # moving tag has no rollout trigger when the tag is repointed and no honest
        # rollback target.
        REPO="${_AR_HOST}/${PROJECT_ID}/${_AR_REPO}"
        kustomize edit set image "celesnity/core=$$REPO/core:$$TAG"

        echo "==> applying"
        kustomize build . | kubectl apply -f -

        # Fail the build on a bad rollout rather than reporting success and leaving a
        # broken revision serving. The API window covers the image pull plus the
        # image initialization; the migration and bootstrap Jobs have already
        # completed. The worker is Recreate, so it has a brief gap.
        echo "==> waiting for rollout"
        kubectl -n ${_NAMESPACE} rollout status deployment/celesnity-core --timeout=600s
        kubectl -n ${_NAMESPACE} rollout status deployment/celesnity-core-worker --timeout=300s

        echo "==> deployed $$TAG"
        kubectl -n ${_NAMESPACE} get pods -l app.kubernetes.io/name=celesnity-core

substitutions:
  # Production triggers override these with location type "region", London,
  # cluster celesnity-gcp-prod, and the production repository.
  _AR_HOST: asia-southeast1-docker.pkg.dev
  _AR_REPO: celesnity-gcp-dev-apps
  _CLUSTER: celesnity-gcp-dev
  _CLUSTER_LOCATION_TYPE: zone
  _CLUSTER_LOCATION: asia-southeast1-a
  _NAMESPACE: celesnity
  # Overlay directory under k8s/overlays, and the Secret Manager name prefix.
  _ENV: gcp-dev
  # Human-readable tag tracking the branch this trigger watches. Never deployed —
  # the commit SHA is.
  _MOVING_TAG: development-latest
  _KUSTOMIZE_VERSION: 5.8.1

options:
  # REQUIRED once a trigger runs as its own service account rather than the legacy
  # Cloud Build account: with the default logging mode the build cannot write to a
  # bucket and fails before the first step.
  logging: CLOUD_LOGGING_ONLY
  # npm ci plus nest build plus prisma generate is CPU-bound and single-image;
  # 8 vCPU keeps it a few minutes rather than ten.
  machineType: E2_HIGHCPU_8

# The default is 10 minutes, which two Node builds plus a rollout wait will exceed.
timeout: 1800s
